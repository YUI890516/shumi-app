<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#E53935">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SHUMI">
  <title>SHUMI</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180-v1.png">
  <style>
    :root {
      --ios-bg: #FAFAFA;
      --ios-card-bg: #FFFFFF;
      --ios-secondary-bg: #F0F0F0;
      --ios-tertiary-bg: #F5F5F5;
      --ios-separator: rgba(0, 0, 0, 0.1);
      --ios-separator-light: rgba(0, 0, 0, 0.06);
      --ios-primary: #E53935;
      --ios-text: #1A1A1A;
      --ios-text-secondary: #999;
      --ios-red: #E53935;
      --ios-green: #43A047;
      --ios-orange: #FB8C00;
      --ios-yellow: #FDD835;
      --ios-indigo: #5C6BC0;
      --app-primary: #E53935;
      --app-primary-dark: #C62828;
      --app-on-primary: #FFFFFF;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.06);
      --shadow-md: 0 6px 16px rgba(0,0,0,0.08);
      --font-system: "Comic Sans MS", "Roundhand", "Hiragino Sans GB", "PingFang SC", -apple-system, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ios-bg: #1A1A1A;
        --ios-card-bg: #2A2A2A;
        --ios-secondary-bg: #333;
        --ios-tertiary-bg: #3A3A3A;
        --ios-separator: rgba(255,255,255,0.1);
        --ios-text: #FFF;
        --ios-text-secondary: #AAA;
        --app-on-primary: #FFF;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-system);
      background: var(--ios-bg);
      color: var(--ios-text);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      display: flex;
    }

    /* 侧边栏 */
    .sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 260px;
      background: var(--ios-card-bg);
      border-right: 0.5px solid var(--ios-separator);
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
      display: flex;
      flex-direction: column;
      padding-top: calc(var(--safe-top) + 16px);
      padding-bottom: calc(var(--safe-bottom) + 16px);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-header {
      padding: 16px 20px 20px;
      font-size: 24px;
      font-weight: 700;
      color: var(--ios-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-logo {
      width: 40px; height: 40px;
      background: var(--app-primary);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700;
      color: var(--app-on-primary);
      box-shadow: var(--shadow-sm);
    }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 0 12px; }
    .sidebar-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px;
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--ios-text);
      font-size: 16px;
      margin-bottom: 4px;
      transition: background 0.15s;
    }
    .sidebar-item:hover, .sidebar-item:active { background: var(--ios-tertiary-bg); }
    .sidebar-item.active {
      background: var(--app-primary);
      color: var(--app-on-primary);
      font-weight: 700;
      border-radius: var(--radius-md);
    }
    .sidebar-icon { width: 28px; text-align: center; font-size: 20px; }
    .sidebar-label { flex: 1; }
    .sidebar-footer { padding: 12px 16px 0; border-top: 0.5px solid var(--ios-separator-light); margin-top: 8px; }
    .sidebar-btn {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 10px 12px;
      background: transparent; border: none;
      color: var(--ios-primary);
      font-size: 15px; font-weight: 600;
      border-radius: var(--radius-sm);
    }
    .sidebar-btn:active { background: var(--ios-tertiary-bg); }
    .sidebar-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 99; opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .sidebar-overlay.visible { opacity: 1; pointer-events: auto; }

    @media (min-width: 768px) {
      .sidebar { transform: translateX(0); position: relative; }
      .sidebar-overlay { display: none !important; }
      .menu-toggle { display: none !important; }
      .main-content { margin-left: 0 !important; width: calc(100% - 260px); }
    }

    /* 主内容区 */
    .main-content {
      flex: 1; display: flex; flex-direction: column;
      height: 100%; width: 100%;
    }
    .nav-bar {
      display: flex; align-items: center;
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 2px solid var(--ios-primary);
      position: sticky; top: 0; z-index: 10;
    }
    @media (prefers-color-scheme: dark) {
      .nav-bar { background: rgba(26,26,26,0.92); }
    }
    .menu-toggle {
      width: 36px; height: 36px;
      background: transparent; border: none;
      font-size: 22px; color: var(--ios-primary);
      margin-right: 10px;
    }
    .nav-title { flex: 1; font-size: 20px; font-weight: 700; text-align: center; padding-right: 36px; color: var(--ios-primary); }
    @media (min-width: 768px) {
      .nav-title { text-align: left; padding-right: 0; }
    }

    /* 状态指示器 */
    .status-bar {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 6px 16px;
      gap: 12px;
      font-size: 12px;
      color: var(--ios-text-secondary);
    }
    .connection-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 20px;
      font-weight: 500; font-size: 12px;
      background: var(--ios-secondary-bg);
      color: var(--ios-text-secondary);
    }
    .connection-badge.connected { background: rgba(52,199,89,0.15); color: var(--ios-green); }
    .connection-badge.offline { background: rgba(255,149,0,0.15); color: var(--ios-orange); }
    .connection-badge.local { background: rgba(142,142,147,0.15); color: var(--ios-text-secondary); }
    .connection-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    /* 内容滚动区 */
    .content-scroll {
      flex: 1; overflow-y: auto;
      padding: 8px 0 calc(var(--safe-bottom) + 24px);
      -webkit-overflow-scrolling: touch;
    }

    /* AQI 栏 */
    .aqi-bar {
      padding: 8px 16px 4px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .aqi-bar::-webkit-scrollbar { display: none; }
    .aqi-loading { color: var(--ios-text-secondary); font-size: 13px; padding: 8px 0; }
    .aqi-card {
      flex-shrink: 0;
      min-width: 130px;
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .aqi-card-source {
      font-size: 10px;
      color: var(--ios-text-secondary);
      font-weight: 500;
      white-space: nowrap;
    }
    .aqi-card-value-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .aqi-card-value {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.1;
    }
    .aqi-card-level {
      font-size: 11px;
      font-weight: 600;
    }
    .aqi-card-pollutant {
      font-size: 10px;
      color: var(--ios-text-secondary);
      white-space: nowrap;
    }
    .aqi-card-time {
      font-size: 9px;
      color: var(--ios-text-tertiary);
      margin-top: 1px;
    }

    /* 卡片 */
    .card {
      background: var(--ios-card-bg);
      border-radius: var(--radius-lg);
      margin: 10px 16px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .card-header {
      padding: 14px 16px;
      font-size: 17px; font-weight: 700;
      border-bottom: 1.5px solid var(--ios-separator-light);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-body { padding: 14px 16px; }
    .card-body.no-padding { padding: 0; }

    /* 日期分组 */
    .date-group { margin-bottom: 4px; }
    .date-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      background: var(--ios-card-bg);
      border-radius: var(--radius-md);
      margin: 8px 16px;
      cursor: pointer;
      user-select: none;
    }
    .date-label { flex: 1; font-size: 16px; font-weight: 600; }
    .date-progress { font-size: 13px; color: var(--ios-text-secondary); }
    .toggle-icon { font-size: 14px; color: var(--ios-text-secondary); width: 18px; text-align: center; }
    .date-tasks { padding: 0 16px; display: none; }
    .date-group.expanded .date-tasks { display: block; }

    /* 任务项 */
    .task-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px;
      background: var(--ios-card-bg);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      box-shadow: var(--shadow-sm);
    }
    .task-checkbox {
      width: 24px; height: 24px;
      border: 2px solid var(--ios-text-secondary);
      border-radius: 50%;
      flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 14px; cursor: pointer;
    }
    .task-checkbox.checked { background: var(--ios-green); border-color: var(--ios-green); }
    .task-content { flex: 1; }
    .task-title { font-size: 16px; font-weight: 500; margin-bottom: 4px; }
    .task-item.completed .task-title { text-decoration: line-through; color: var(--ios-text-secondary); }
    .task-meta { font-size: 13px; color: var(--ios-text-secondary); line-height: 1.5; }
    .task-actions { display: flex; gap: 8px; margin-top: 8px; }

    /* 按钮 */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 18px; border-radius: 20px;
      border: none; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s, transform 0.05s;
      box-shadow: var(--shadow-sm);
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary { background: var(--ios-primary); color: white; }
    .btn-secondary { background: var(--ios-secondary-bg); color: var(--ios-text); }
    .btn-ghost { background: transparent; color: var(--ios-primary); padding: 8px 10px; box-shadow: none; }
    .btn-danger { background: var(--ios-red); color: white; }
    .btn-yellow { background: var(--app-primary); color: var(--app-on-primary); }

    /* 表单 */
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--ios-text-secondary); }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 11px 12px;
      border: 1px solid var(--ios-separator-light);
      border-radius: var(--radius-sm);
      background: var(--ios-tertiary-bg);
      color: var(--ios-text);
      font-size: 16px; font-family: inherit;
    }
    .form-textarea { min-height: 80px; resize: vertical; }

    /* 空状态 */
    .empty-state { text-align: center; padding: 48px 24px; color: var(--ios-text-secondary); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-title { font-size: 17px; font-weight: 600; color: var(--ios-text); margin-bottom: 6px; }

    /* 单词卡片 */
    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .word-card {
      background: var(--ios-tertiary-bg);
      border-radius: var(--radius-md);
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
    }
    .word-card:active { transform: scale(0.98); }
    .word-card.reviewed { border-color: var(--ios-green); background: rgba(52,199,89,0.08); }
    .word-en { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .word-zh { font-size: 14px; color: var(--ios-text-secondary); min-height: 20px; }
    .word-zh.hidden { opacity: 0; }

    /* 辅食 */
    .meal-section { margin-bottom: 16px; }
    .meal-title { font-size: 18px; font-weight: 700; margin: 16px 16px 10px; display: flex; align-items: center; gap: 8px; }
    .meal-card { margin: 8px 16px; }

    /* 古诗 */
    .poetry-card { margin: 8px 16px; }
    .poetry-header { display: flex; align-items: center; gap: 12px; padding: 16px; background: linear-gradient(135deg, #FFF8E1, #FFE082); border-radius: var(--radius-md) var(--radius-md) 0 0; }
    .poetry-icon { font-size: 32px; }
    .poetry-title { font-size: 20px; font-weight: 700; color: #5D4037; }
    .poetry-meta { font-size: 13px; color: #8D6E63; margin-top: 2px; }
    .poetry-week { margin-left: auto; padding: 4px 12px; background: rgba(255,214,10,0.3); border-radius: 20px; font-size: 12px; font-weight: 600; color: #5D4037; }
    .poetry-content { padding: 20px 16px; text-align: center; }
    .poetry-line { font-size: 19px; font-weight: 600; line-height: 2; color: var(--ios-text); letter-spacing: 2px; }
    .poetry-explain { padding: 14px 16px; border-top: 0.5px solid var(--ios-separator-light); background: var(--ios-tertiary-bg); }
    .poetry-explain-title { font-size: 13px; font-weight: 600; color: var(--ios-text-secondary); margin-bottom: 6px; }
    .poetry-explain-text { font-size: 15px; line-height: 1.6; color: var(--ios-text); }
    .poetry-tags { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px; border-top: 0.5px solid var(--ios-separator-light); }
    .poetry-actions { padding: 12px 16px; border-top: 0.5px solid var(--ios-separator-light); display: flex; gap: 10px; }
    .meal-card .card-body { padding: 0; }
    .meal-header {
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--app-primary), #FFE033);
      color: var(--app-on-primary);
      display: flex; align-items: center; justify-content: space-between;
    }
    .meal-name { font-size: 17px; font-weight: 700; }
    .meal-type { font-size: 12px; opacity: 0.85; font-weight: 500; }
    .meal-dishes { padding: 12px 16px; }
    .dish-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--ios-separator-light);
    }
    .dish-item:last-child { border-bottom: none; }
    .dish-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
    .dish-info { flex: 1; }
    .dish-name { font-size: 15px; font-weight: 500; }
    .dish-note { font-size: 12px; color: var(--ios-text-secondary); margin-top: 2px; }
    .nutrition-tags {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 10px 16px; border-top: 0.5px solid var(--ios-separator-light);
    }
    .tag {
      padding: 4px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 500;
      background: var(--ios-tertiary-bg); color: var(--ios-text-secondary);
    }
    .tag.active { background: rgba(52,199,89,0.12); color: var(--ios-green); }

    /* 设置页 */
    .setting-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 0.5px solid var(--ios-separator-light);
    }
    .setting-item:last-child { border-bottom: none; }
    .setting-label { font-size: 16px; }
    .setting-desc { font-size: 13px; color: var(--ios-text-secondary); margin-top: 2px; }

    /* 弹窗 */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200; display: none; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.visible { display: flex; }
    .modal-sheet {
      background: var(--ios-card-bg);
      width: 100%; max-width: 600px;
      max-height: 90vh; border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      overflow: hidden; display: flex; flex-direction: column;
      transform: translateY(100%); transition: transform 0.3s;
    }
    .modal-overlay.visible .modal-sheet { transform: translateY(0); }
    .modal-header {
      padding: 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 0.5px solid var(--ios-separator-light);
    }
    .modal-title { font-size: 18px; font-weight: 700; }
    .modal-close { font-size: 24px; color: var(--ios-text-secondary); background: none; border: none; padding: 0 4px; }
    .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 12px 16px; border-top: 0.5px solid var(--ios-separator-light); display: flex; justify-content: flex-end; gap: 10px; }

    /* 列表项 */
    .list-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--ios-separator-light);
    }
    .list-row:last-child { border-bottom: none; }
    .list-icon { font-size: 22px; width: 30px; text-align: center; }
    .list-content { flex: 1; }
    .list-title { font-size: 16px; }
    .list-subtitle { font-size: 13px; color: var(--ios-text-secondary); }
    .list-action { color: var(--ios-text-secondary); }

    /* 工具栏 */
    .toolbar { display: flex; gap: 8px; padding: 8px 16px; flex-wrap: wrap; }

    /* 进度条 */
    .progress-bar {
      height: 6px; background: var(--ios-tertiary-bg);
      border-radius: 3px; overflow: hidden; margin: 8px 0;
    }
    .progress-fill { height: 100%; background: var(--ios-green); border-radius: 3px; transition: width 0.3s; }

    /* 通知 */
    .toast {
      position: fixed; bottom: calc(var(--safe-bottom) + 24px); left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(40,40,40,0.92); color: white;
      padding: 12px 20px; border-radius: 24px;
      font-size: 14px; z-index: 300; opacity: 0;
      transition: all 0.3s; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* 隐藏 */
    .hidden { display: none !important; }

    /* 响应式 */
    @media (max-width: 767px) {
      .word-grid { grid-template-columns: repeat(2, 1fr); }
    }

    #sss-player-bar, #book-player-bar {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(76px + var(--safe-bottom));
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      padding: 10px 14px;
      z-index: 900;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(0,0,0,0.06);
    }
    #sss-player-bar .spb-info, #book-player-bar .spb-info { flex: 1; min-width: 0; }
    #sss-player-bar .spb-title, #book-player-bar .spb-title {
      font-size: 14px; font-weight: 600; color: var(--ios-text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #sss-player-bar .spb-sub, #book-player-bar .spb-sub {
      font-size: 11px; color: var(--ios-text-secondary); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #sss-player-bar .spb-btn, #book-player-bar .spb-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: none; background: var(--ios-tertiary-bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: var(--ios-text); cursor: pointer;
      flex-shrink: 0; padding: 0;
    }
    #sss-player-bar .spb-btn:active, #book-player-bar .spb-btn:active { background: var(--ios-separator); }
    #sss-player-bar .spb-btn.spb-play, #book-player-bar .spb-btn.spb-play {
      background: var(--ios-primary); color: #fff;
    }
    #sss-player-bar .spb-btn.spb-play:active, #book-player-bar .spb-btn.spb-play:active { opacity: 0.8; }
    #sss-player-bar .spb-close, #book-player-bar .spb-close {
      width: 28px; height: 28px; font-size: 16px;
      background: transparent; color: var(--ios-text-secondary);
    }
  </style>
</head>
<body>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">S</div>
      <span>SHUMI</span>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-footer">
      <button class="sidebar-btn" onclick="app.openSidebarManager()">
        <span>⚙️</span> 管理模块
      </button>
    </div>
  </nav>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="app.closeSidebar()"></div>

  <main class="main-content">
    <header class="nav-bar">
      <button class="menu-toggle" onclick="app.toggleSidebar()">☰</button>

// 判断食材是否应季
const isInSeason = (item, month) => {
  if (!item.season || item.season.length === 0) return true;
  const [start, end] = item.season;
  if (start <= end) return month >= start && month <= end;
  return month >= start || month <= end; // 跨年季节
};

/* 根据日期获取每日句子（确定性，同一天句子不变） */
const getDailySentence = (dateStr) => {
  let h = 0;
  for (let i = 0; i < dateStr.length; i++) {
    h = ((h << 5) - h) + dateStr.charCodeAt(i);
    h = h & h;
  }
  const idx = Math.abs(h) % DAILY_SENTENCES.length;
  return DAILY_SENTENCES[idx];
};

const fmtDate = d => {
  const dt = (typeof d === 'string') ? new Date(d + (d.length <= 10 ? 'T00:00:00' : '')) : new Date(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};
const todayStr = () => fmtDate(new Date());
const formatDateLabel = dateStr => {
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  const d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const weekdays = ['日','一','二','三','四','五','六'];
  const base = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${weekdays[d.getDay()]}`;
  if (+d0 === +today) return `${base} · 今天`;

  return base;
};
const uuid = () => {

/* ================= 存储层 ================= */

class StorageManager {
  constructor() {
    this.dbName = 'workbench_db_v1';
    this.dbVersion = 2;
    this.db = null;
  }

  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.dbName, this.dbVersion);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('tasks')) {
          const s = db.createObjectStore('tasks', {keyPath:'id'});
          s.createIndex('date','date',{unique:false});
          s.createIndex('module','module',{unique:false});
        }
        if (!db.objectStoreNames.contains('words')) {
          const s = db.createObjectStore('words', {keyPath:'id'});
          s.createIndex('grade','grade',{unique:false});
          s.createIndex('category','category',{unique:false});
        }
        if (!db.objectStoreNames.contains('custom_modules')) {
          db.createObjectStore('custom_modules', {keyPath:'id'});
        }
        if (!db.objectStoreNames.contains('custom_food_ingredients')) {
          db.createObjectStore('custom_food_ingredients', {keyPath:'id'});
        }
      };
      req.onsuccess = e => { this.db = e.target.result; resolve(); };
      req.onerror = e => reject(e.target.error);
    });
  }

  tx(store, mode='readonly') {
    return this.db.transaction([store], mode).objectStore(store);
  }

  async get(store, id) {
    return new Promise((resolve, reject) => {
      const req = this.tx(store).get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async getAll(store) {
    return new Promise((resolve, reject) => {
      const req = this.tx(store).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async getByIndex(store, idx, value) {
    return new Promise((resolve, reject) => {
      const req = this.tx(store).index(idx).getAll(value);
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  async put(store, item) {
    return new Promise((resolve, reject) => {
      const req = this.tx(store, 'readwrite').put(item);
      req.onsuccess = () => resolve(item);
      req.onerror = () => reject(req.error);
    });
  }

  async delete(store, id) {
    return new Promise((resolve, reject) => {
      const req = this.tx(store, 'readwrite').delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }
}

      {id:'babypoetry', name:'宝宝古诗', icon:'📖', visible:true},

    ],
    supabase:{enabled:false, url:'', anonKey:'', lastSync:null},
    expandedDates:{},
    customModules:[]
  };
}

function saveConfig(cfg) {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
}

function getModuleConfig(id) {
  const cfg = getConfig();
  const fixed = FIXED_MODULES.find(m => m.id === id);
  if (fixed) return {...fixed, visible:true};
  const custom = cfg.customModules.find(m => m.id === id);
  if (custom) return {...custom, fixed:false};
  return null;
}

function getVisibleModules() {
  const cfg = getConfig();
  const list = [];
  // 所有非 system 的固定模块
  FIXED_MODULES.filter(m => !m.system).forEach(m => {
    const cfgItem = cfg.sidebar.find(s => s.id === m.id);
    const visible = cfgItem ? cfgItem.visible : true;
    if (visible) list.push({...m, visible:true, fixed:true});
  });
  cfg.customModules.forEach(item => {
    if (item.visible !== false) list.push({...item, fixed:false});
  });
  // system 模块（设置）放最后
  FIXED_MODULES.filter(m => m.system).forEach(m => {
    list.push({...m, visible:true});
  });
  return list;
}

/* ================= 同步管理（Supabase预留） ================= */

class SyncManager {
  constructor() {
    this.provider = null; // null, 'supabase'
    this.client = null;
    this.queue = [];
  }

  getStatus() {
    const cfg = getConfig();
    if (!cfg.supabase?.enabled || !cfg.supabase?.url || !cfg.supabase?.anonKey) return 'local';
    if (!navigator.onLine) return 'offline';
    return this.provider === 'supabase' ? 'connected' : 'offline';
  }

  async loadSDK() {
    if (window.supabase) return;
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  async enable(url, anonKey) {
    await this.loadSDK();
    this.client = window.supabase.createClient(url, anonKey, {
      auth:{persistSession:true, autoRefreshToken:true}
    });
    this.provider = 'supabase';
    const cfg = getConfig();
    cfg.supabase = {enabled:true, url, anonKey, lastSync: new Date().toISOString()};
    saveConfig(cfg);
    // 触发同步
    try {
      await this.pushAll();
      await this.pullAll();
      cfg.supabase.lastSync = new Date().toISOString();
      saveConfig(cfg);
      return true;
    } catch(e) { throw e; }
  }

  async pushAll() {
    if (!this.client) return;
    const tables = ['tasks','words','custom_modules'];
    for (const t of tables) {
      const items = await storage.getAll(t);
      for (const item of items) {
        await this.client.from('workbench_'+t).upsert({
          id: item.id, user_id: getConfig().userId,
          data: JSON.stringify(item), updated_at: new Date().toISOString()
        });
      }
    }
  }

  async pullAll() {
    if (!this.client) return;
    const tables = ['tasks','words','custom_modules'];
    for (const t of tables) {
      const {data, error} = await this.client.from('workbench_'+t)
        .select('*').eq('user_id', getConfig().userId);
      if (error) throw error;
      if (data) {
        for (const row of data) {
          try { await storage.put(t, JSON.parse(row.data)); } catch(e){}
        }
      }
    }
  }

  renderBadge() {
    const status = this.getStatus();
    const map = {
      local: {cls:'local', text:'仅本地存储', dot:'⚪'},
      offline: {cls:'offline', text:'离线（已保存本地）', dot:'🟠'},
      connected: {cls:'connected', text:'已连接云端', dot:'🟢'}
    };
    const m = map[status];
    const el = $('connection-status');
    if (el) el.innerHTML = `<span class="connection-badge ${m.cls}"><span class="connection-dot"></span>${m.text}</span>`;
  }
}

/* ================= 随机数与日期种子 ================= */

class SeededRandom {
  constructor(seed) {
    let h = 0;
    const str = String(seed);
    for (let i=0;i<str.length;i++) {
      h = ((h<<5)-h)+str.charCodeAt(i); h = h & h;
    }
    this.seed = Math.abs(h) || 1;
  }
  next() {
    this.seed = (this.seed * 1664525 + 1013904223) & 0xFFFFFFFF;
    return (this.seed >>> 0) / 0xFFFFFFFF;
  }
  pick(arr) { return arr[Math.floor(this.next()*arr.length)]; }
  pickExclude(arr, excludeFn) {
    const filtered = arr.filter(x => !excludeFn(x));
    return this.pick(filtered.length ? filtered : arr);
  }
  bool(p) { return this.next() < p; }
}

/* ================= 辅食生成器 ================= */

class MealGenerator {
  constructor() {
    this.usageMap = null;
  }

  async getUsageMap() {
    if (this.usageMap) return this.usageMap;
    const tasks = await storage.getAll('tasks');
    const cutoff = Date.now() - 90 * 24 * 60 * 60 * 1000;
    const map = {};
    for (const t of tasks) {
      if (t.module !== 'babyfood') continue;
      const td = new Date(t.date + 'T00:00:00');
      if (td.getTime() < cutoff) continue;
      if (t.content?.dishes) {
        for (const d of t.content.dishes) {
          if (!d) continue;
          for (const ing of d.ingredients || []) {
            map[ing] = (map[ing] || 0) + 1;
          }
        }
      }
    }
    this.usageMap = map;
    return map;
  }

  clearCache() {
    this.usageMap = null;
  }

  isInSeason(item, month) {
    if (!item.season || item.season.length === 0) return true;
    const [start, end] = item.season;
    if (start <= end) return month >= start && month <= end;
    return month >= start || month <= end;
  }

  filterSeasonal(arr, month) {
    const seasonal = arr.filter(item => this.isInSeason(item, month));
    return seasonal.length ? seasonal : arr;
  }

  isIncompatible(ingredient, existingIngredients) {
    const conflicts = FOOD_DATA.incompatible[ingredient];
    if (!conflicts) return false;
    return existingIngredients.some(i => conflicts.includes(i));
  }

  filterCompatible(candidates, existingIngredients) {
    return candidates.filter(c => !this.isIncompatible(c.name, existingIngredients));
  }

  pickByUsage(pool, usageMap, rng) {
    if (!pool.length) return null;
    // 找出最小使用次数
    let minCount = Infinity;
    for (const item of pool) {
      const count = usageMap[item.name] || 0;
      if (count < minCount) minCount = count;
    }
    // 优先选择使用次数<=minCount+1的，但保留所有候选避免枯竭
    const preferred = pool.filter(item => (usageMap[item.name] || 0) <= minCount + 1);
    const pickPool = preferred.length ? preferred : pool;
    return rng.pick(pickPool);
  }

  hasHighFiberSoFar(dishes, threshold = 1) {
    let count = 0;
    for (const d of dishes) {
      if (!d) continue;
      if (d.fiber === 'high') count++;
    }
    return count >= threshold;
  }

  hasLegumeSoFar(dishes) {
    return dishes.some(d => d.legume);
  }

  // 获取菜品中已使用的食材名
  usedNames(dishes) {
    return dishes.flatMap(d => d.ingredients || [d.name]);
  }

  // 判断食材是否提供天然甜味且宝宝喜欢
  isSweetAndLiked(item) {
    return item.flavor === 'sweet' && item.common;
  }

  getCookMethod(rng, type = 'normal') {
    const methods = [
      {name:'清蒸', prefix:'清蒸', suffix:'', note:'少盐，蒸至软烂'},
      {name:'水煮', prefix:'水煮', suffix:'', note:'少盐，水煮软烂'},
      {name:'炖汤', prefix:'炖', suffix:'汤', note:'少盐，炖煮至软烂入味'}
    ];
    return rng.pick(methods);
  }

  // 主食名称
  getStapleName(staple) {
    return staple.name;
  }

  // 选择主食
  pickStaple(rng, month, usageMap, isLunch, usedStaple = null, extraExclude = [], freqStats = {}) {
    // usedStaple 可以是 staple 对象、dish 对象或名称字符串
    const usedStapleName = usedStaple ? (usedStaple.name || usedStaple) : null;
    const excludeSet = new Set([usedStapleName, ...extraExclude].filter(Boolean));
    let pool = FOOD_DATA.staples.filter(s => !excludeSet.has(s.name));
    if (!isLunch) {
      // 晚餐只选易消化主食
      pool = pool.filter(s => !s.lunchOnly);
    }
    pool = this.filterSeasonal(pool, month);
    // 豆类杂粮主食（红豆薏米、绿豆百合、绿豆莲子）每 10 天只轮流出现一次
    const legumeStaples = ['红豆薏米', '绿豆百合', '绿豆莲子'];
    const legumeStapleUsed = legumeStaples.find(name => (freqStats.legumeStapleDays || 0) > 0 && freqStats.lastLegumeStaple === name);
    if (freqStats.legumeStapleRecent) {
      // 10 天内用过的豆类杂粮主食全部排除
      pool = pool.filter(s => !freqStats.legumeStapleRecent.includes(s.name));
    }
    return this.pickByUsage(pool, usageMap, rng);
  }

  // 选择绿叶菜（第二行）
  pickGreen(rng, month, usageMap, usedIngredients, maxFiber = 'high') {
    let pool = FOOD_DATA.greens.filter(g => !usedIngredients.includes(g.name));
    if (maxFiber === 'low') {
      pool = pool.filter(g => g.fiber === 'low');
    } else if (maxFiber === 'mid') {
      pool = pool.filter(g => g.fiber !== 'high');
    }
    pool = this.filterSeasonal(pool, month);
    pool = this.filterCompatible(pool, usedIngredients);
    return this.pickByUsage(pool, usageMap, rng);
  }

  // 选择蛋白质
  // meatTypeFilter: 'red' 只选红肉, 'white' 只选白肉, undefined 不限
  // freqStats: { monthGoose, duckDays, lambDays, weekFish } 频率统计
  pickProtein(rng, month, usageMap, usedIngredients, opts = {}) {
    let pool = FOOD_DATA.proteins.filter(p => !usedIngredients.includes(p.name));
    if (opts.meatTypeFilter) {
      pool = pool.filter(p => p.meatType === opts.meatTypeFilter);
    }
    if (opts.noEgg) pool = pool.filter(p => p.sub !== 'egg');

    // 频率控制
    const fs = opts.freqStats || {};
    pool = pool.filter(p => {
      if (!p.freq) return true;
      if (p.freq === 'goose_monthly') {
        // 鹅肝每月2次
        return (fs.monthGoose || 0) < 2;
      }
      if (p.freq === 'duck_biweekly') {
        // 鸭肉每半月（15天）出现1天
        return (fs.duckDays || 0) < 1;
      }
      if (p.freq === 'lamb_25d') {
        // 羊肉每25天1顿
        return (fs.lambDays || 0) < 1;
      }
      if (p.freq === 'fish_weekly') {
        // 鱼虾每周2-3次
        return (fs.weekFish || 0) < 3;
      }
      return true;
    });

    pool = this.filterSeasonal(pool, month);
    pool = this.filterCompatible(pool, usedIngredients);
    return this.pickByUsage(pool, usageMap, rng);
  }

  // 选择配菜
  pickSide(rng, month, usageMap, usedIngredients, opts = {}) {
    let pool = FOOD_DATA.sides.filter(s => !usedIngredients.includes(s.name));
    if (opts.maxFiber) {
      if (opts.maxFiber === 'low') pool = pool.filter(s => s.fiber === 'low');
      if (opts.maxFiber === 'mid') pool = pool.filter(s => s.fiber !== 'high');
    }
    if (opts.avoidStarchy) pool = pool.filter(s => !s.starchy);
    if (opts.preferStarchy) {
      const starchy = pool.filter(s => s.starchy);
      if (starchy.length) pool = starchy;
    }
    if (opts.preferSweet) {
      const sweet = pool.filter(s => s.flavor === 'sweet');
      if (sweet.length) pool = sweet;
    }
    // 优先与蛋白质搭配
    if (opts.protein) {
      const compat = FOOD_DATA.pairing[opts.protein] || [];
      const compatPool = pool.filter(s => compat.includes(s.name));
      if (compatPool.length) pool = compatPool;
    }
    pool = this.filterSeasonal(pool, month);
    pool = this.filterCompatible(pool, usedIngredients);
    return this.pickByUsage(pool, usageMap, rng);
  }

  // 选择豆制品或豆类
  // 豆腐和全豆轮流出现，用 rng 随机决定类型，全豆不受纤维限制
  pickBeanOrLegume(rng, month, usageMap, usedIngredients, maxFiber = 'high') {
    const preferTofu = rng.bool(0.5);
    const groups = preferTofu
      ? [FOOD_DATA.beans, FOOD_DATA.legumes]
      : [FOOD_DATA.legumes, FOOD_DATA.beans];
    
    for (const group of groups) {
      let pool = group.filter(b => !usedIngredients.includes(b.name));
      // 豆腐受纤维限制，全豆不受（适量食用即可）
      if (group === FOOD_DATA.beans) {
        if (maxFiber === 'low') pool = pool.filter(b => b.fiber === 'low');
        if (maxFiber === 'mid') pool = pool.filter(b => b.fiber !== 'high');
      }
      pool = this.filterCompatible(pool, usedIngredients);
      if (pool.length) return this.pickByUsage(pool, usageMap, rng);
    }
    return null;
  }

  // 检查是否满足"天然甜味且宝宝喜欢"
  ensureSweetLiked(dishes) {
    return dishes.some(d => d.ingredients && d.ingredients.some(ing => {
      const allFoods = [...FOOD_DATA.staples, ...FOOD_DATA.proteins, ...FOOD_DATA.greens, ...FOOD_DATA.sides, ...FOOD_DATA.beans, ...FOOD_DATA.legumes];
      const item = allFoods.find(f => f.name === ing);
      return item && this.isSweetAndLiked(item);
    }));
  }

  // 计算去重食材数
  countIngredients(dishes) {
    // 主食算 1 种食材（如"米饭+糙米"含米饭和糙米，但算 1 种主食）
    const set = new Set();
    for (const d of dishes) {
      if (!d) continue; // 跳过 null 占位
      if (d.category === 'staple') {
        set.add(d.name); // 主食按菜名算 1 种
      } else {
        for (const ing of (d.ingredients || [d.name])) set.add(ing);
      }
    }
    return set.size;
  }

  // 组装一道菜名
  makeDishName(item, method, category, partnerName = '') {
    if (category === 'bean') {
      if (item.cookStyle && item.cookStyle.includes('清蒸')) {
        return `清蒸${item.name}`;
      }
      return `${item.name}炖汤`;
    }
    if (category === 'legume') {
      return `${method.prefix}${item.name}${method.suffix || '汤'}`;
    }
    if (category === 'protein' || category === 'fish') {
      if (partnerName) {
        if (method.suffix === '汤') return `${partnerName}${item.name}炖汤`;
        return `${method.prefix}${partnerName}${item.name}`;
      }
      return `${method.prefix}${item.name}`;
    }
    if (category === 'green') {
      return `${method.prefix}${item.name}`;
    }
    if (category === 'side') {
      return `${method.prefix}${item.name}`;
    }
    return `${method.prefix}${item.name}`;
  }

  // 生成一餐
  // 适合搭配蛋白质的配菜（炖煮/清蒸，避免单独成菜）
  goodProteinPartners() {
    return ['胡萝卜','土豆','南瓜','山药','白萝卜','冬瓜','莲藕','番茄','玉米','豌豆','毛豆','香菇','蘑菇','白蘑菇','平菇','蟹味菇'];
  }

  // 适合搭配豆制品的配菜
  goodBeanPartners() {
    return ['香菇','蘑菇','白蘑菇','平菇','蟹味菇','胡萝卜','番茄','南瓜','木耳','玉米','豌豆'];
  }

  // 天然甜味配菜（单独成菜或搭配）
  sweetSides() {
    return ['胡萝卜','番茄','南瓜','玉米','红薯','彩椒','洋葱','豌豆','毛豆'];
  }

  // 调味类配菜（不单独成菜，只作为辅料）
  seasoningSides() {
    return ['洋葱','彩椒','韭菜','芹菜','香菜'];
  }

  // 选择蛋白质搭配配菜
  pickProteinPartner(rng, month, usageMap, usedIngredients, maxFiber, avoidStarchy) {
    let pool = FOOD_DATA.sides.filter(s => this.goodProteinPartners().includes(s.name) && !usedIngredients.includes(s.name));
    if (maxFiber === 'low') pool = pool.filter(s => s.fiber === 'low');
    if (maxFiber === 'mid') pool = pool.filter(s => s.fiber !== 'high');
    if (avoidStarchy) pool = pool.filter(s => !s.starchy);
    pool = this.filterSeasonal(pool, month);
    pool = this.filterCompatible(pool, usedIngredients);
    // 优先甜味
    const sweet = pool.filter(s => s.flavor === 'sweet');
    if (sweet.length) pool = sweet;
    return this.pickByUsage(pool, usageMap, rng);
  }

  // 选择豆制品搭配配菜
  pickBeanPartner(rng, month, usageMap, usedIngredients, maxFiber) {
    let pool = FOOD_DATA.sides.filter(s => this.goodBeanPartners().includes(s.name) && !usedIngredients.includes(s.name));
    if (maxFiber === 'low') pool = pool.filter(s => s.fiber === 'low');
    if (maxFiber === 'mid') pool = pool.filter(s => s.fiber !== 'high');
    pool = this.filterSeasonal(pool, month);
    pool = this.filterCompatible(pool, usedIngredients);
    const sweet = pool.filter(s => s.flavor === 'sweet');
    if (sweet.length) pool = sweet;
    return this.pickByUsage(pool, usageMap, rng);
  }

  // 选择额外配菜（单独成菜，优先甜味根茎瓜果）
  // 山药只做搭配配菜，不单独成菜
  pickExtraSide(rng, month, usageMap, usedIngredients, maxFiber, avoidStarchy) {
    let pool = FOOD_DATA.sides.filter(s => !this.seasoningSides().includes(s.name) && s.sub !== 'mushroom' && s.name !== '山药' && !usedIngredients.includes(s.name));
    if (maxFiber === 'low') pool = pool.filter(s => s.fiber === 'low');
    if (maxFiber === 'mid') pool = pool.filter(s => s.fiber !== 'high');
    if (avoidStarchy) pool = pool.filter(s => !s.starchy);
    pool = this.filterSeasonal(pool, month);
    pool = this.filterCompatible(pool, usedIngredients);
    const sweet = pool.filter(s => s.flavor === 'sweet' && s.common);
    if (sweet.length) pool = sweet;
    return this.pickByUsage(pool, usageMap, rng);
  }


  generateMeal(seed, month, usageMap, opts = {}) {
    const rng = new SeededRandom(seed);
    const isLunch = opts.isLunch !== false;
    const usedStaple = opts.usedStaple || null;
    // 跨餐去重：另一餐已用的非肉类食材，本餐不再出现
    const crossUsed = opts.crossMealUsed || [];
    // 跨餐已用的淀粉类配菜名（每天最多一种淀粉配菜，除主食外）
    const crossStarchyUsed = opts.crossStarchyUsed || [];
    // 南瓜和胡萝卜不能出现在同一天
    const crossHasPumpkin = opts.crossHasPumpkin || false;
    const crossHasCarrot = opts.crossHasCarrot || false;
    // 跨餐已有豆制品时，本餐不再选豆制品（每天最多一种豆制品）
    const crossHasBean = opts.crossHasBean || false;

    const dishes = [];
    const mealItems = [];

    // 合并当前餐已用 + 跨餐已用（用于配菜/绿叶菜/豆制品去重，肉类不受限）
    const usedAll = () => this.usedNames(dishes).concat(crossUsed);

    // 检查当前餐+跨餐是否已有南瓜/胡萝卜（两者不能同天出现）
    const hasPumpkinNow = () => this.usedNames(dishes).includes('南瓜') || crossHasPumpkin;
    const hasCarrotNow = () => this.usedNames(dishes).includes('胡萝卜') || crossHasCarrot;
    // 南瓜和胡萝卜互斥：有其中一个就排除另一个
    const pumpkinCarrotExclude = () => {
      const ex = [];
      if (hasPumpkinNow()) ex.push('南瓜', '胡萝卜');
      if (hasCarrotNow()) ex.push('南瓜', '胡萝卜');
      return ex;
    };

    // 淀粉类配菜排除：如果今天已有淀粉配菜，排除所有淀粉类配菜（每天最多一种）
    const allStarchySideNames = FOOD_DATA.sides.filter(s => s.starchy).map(s => s.name);
    const starchyTodayUsed = [...crossStarchyUsed];
    const starchyExclude = starchyTodayUsed.length > 0 ? [...allStarchySideNames] : [];

    // 1. 主食（第一行）— 晚餐时排除午餐已用的主食
    const stapleUsedSet = new Set([...(crossUsed || []), ...(usedStaple ? [usedStaple.name || usedStaple] : [])]);
    const staple = this.pickStaple(rng, month, usageMap, isLunch, stapleUsedSet.size ? { name: [...stapleUsedSet][0] } : null, [...stapleUsedSet], opts.freqStats || {});
    if (!staple) throw new Error('No staple available');
    const isLegumeStaple = ['红豆薏米', '绿豆百合', '绿豆莲子'].includes(staple.name);
    dishes.push({
      name: this.getStapleName(staple),
      category: 'staple',
      ingredients: staple.ingredients || [staple.name],
      note: staple.difficult ? '难消化主食，安排在午餐' : (staple.legume ? '豆类主食，富含蛋白质' : ''),
      fiber: staple.fiber,
      legume: !!staple.legume
    });
    mealItems.push(staple);

    // 纤维限制
    const stapleHighFiber = staple.fiber === 'high';
    const stapleLegume = !!staple.legume;
    // 豆类杂粮主食（红豆薏米、绿豆百合、绿豆莲子）：不与难消化食材一起，且必须当餐有山药
    const maxFiber = (stapleHighFiber || stapleLegume) ? 'low' : (staple.fiber === 'mid' ? 'mid' : 'high');
    const avoidStarchy = staple.starchy || ['rice','wonton','noodle','pasta','millet','dough_drop'].some(x => staple.sub === x || staple.sub.startsWith(x + '_'));
    // 豆类杂粮主食强制搭配山药：将山药标记为必须选的配菜
    const needYamshan = isLegumeStaple;

    // 2. 绿叶菜（第二行，只一种），可搭配蘑菇
    let green = this.pickGreen(rng, month, usageMap, usedAll(), maxFiber);
    if (!green) green = this.pickGreen(rng, month, usageMap, usedAll(), 'high');
    if (green) {
      const method = this.getCookMethod(rng);
      // 尝试为绿叶菜搭配蘑菇（蘑菇不单独成菜，只作为搭配）
      const mushroomPool = FOOD_DATA.sides.filter(s => s.sub === 'mushroom' && !usedAll().includes(s.name));
      const seasonalMushrooms = this.filterSeasonal(mushroomPool, month);
      const mushroomPartner = seasonalMushrooms.length ? this.pickByUsage(seasonalMushrooms, usageMap, rng) : null;
      const partnerName = mushroomPartner ? mushroomPartner.name : '';
      dishes.push({
        name: partnerName ? `${partnerName}${green.name}` : this.makeDishName(green, method, 'green'),
        category: 'vegetable',
        ingredients: [green.name, ...(partnerName ? [partnerName] : [])],
        note: `${method.note}，易消化`,
        fiber: green.fiber
      });
      mealItems.push(green);
      if (mushroomPartner) mealItems.push(mushroomPartner);
    }

    // 3. 蛋白质类（每餐必须包含肉）
    const fs = opts.freqStats || {};
    let protein = null;
    if (isLunch) {
      protein = this.pickProtein(rng, month, usageMap, this.usedNames(dishes), {
        meatTypeFilter: 'red',
        freqStats: fs
      });
    } else {
      if (rng.bool(0.6)) {
        protein = this.pickProtein(rng, month, usageMap, this.usedNames(dishes), {
          meatTypeFilter: 'white',
          noEgg: true,
          freqStats: fs
        });
      }
      if (!protein) {
        protein = this.pickProtein(rng, month, usageMap, this.usedNames(dishes), {
          meatTypeFilter: 'red',
          noEgg: true,
          freqStats: fs
        });
      }
    }
    if (!protein) {
      protein = this.pickProtein(rng, month, usageMap, this.usedNames(dishes), {
        meatTypeFilter: isLunch ? 'red' : undefined
      });
    }
    if (protein) {
      const method = this.getCookMethod(rng);
      // 蛋白质搭配一种合适的配菜（排除当天已用的淀粉配菜和南瓜/胡萝卜冲突）
      const partnerExclude = [...starchyExclude, ...pumpkinCarrotExclude()];
      // 豆类杂粮主食时优先选山药作为蛋白质搭配
      let partner = null;
      if (needYamshan) {
        const yamshan = FOOD_DATA.sides.find(s => s.name === '山药' && !usedAll().includes('山药') && !partnerExclude.includes('山药'));
        if (yamshan) partner = yamshan;
      }
      if (!partner) {
        partner = this.pickProteinPartner(rng, month, usageMap, usedAll().concat(partnerExclude), maxFiber, avoidStarchy);
      }
      // 如果严格条件下找不到搭配，逐步放宽限制（肉类必须搭配其他食材）
      if (!partner) {
        partner = this.pickProteinPartner(rng, month, usageMap, usedAll().concat(partnerExclude), maxFiber, false);
      }
      if (!partner) {
        partner = this.pickProteinPartner(rng, month, usageMap, usedAll().concat(partnerExclude), 'high', false);
      }
      if (!partner) {
        // 最后放宽：允许淀粉类配菜和南瓜/胡萝卜
        partner = this.pickProteinPartner(rng, month, usageMap, usedAll(), 'high', false);
      }
      const partnerName = partner ? partner.name : '';
      dishes.push({
        name: this.makeDishName(protein, method, protein.category === 'fish' ? 'fish' : 'protein', partnerName),
        category: protein.category === 'fish' ? 'fish' : 'protein',
        ingredients: [protein.name, ...(partnerName ? [partnerName] : [])],
        note: `${method.note}，切小块`,
        fiber: protein.fiber || 'low'
      });
      if (partner) mealItems.push(partner);
      // 如果配菜是淀粉类，排除所有淀粉类配菜（每天最多一种）
      if (partner && partner.starchy) starchyExclude.push(...allStarchySideNames);
    }

    // 3.5 豆类杂粮主食需要山药搭配：优先让蛋白质配菜选山药
    // 如果蛋白质已选了其他配菜，则让豆制品配菜选山药；都不行则不强制添加（山药不单独成菜）
    if (needYamshan && !this.usedNames(dishes).includes('山药')) {
      // 尝试把山药加入蛋白质菜品的配菜中
      const proteinDish = dishes.find(d => (d.category === 'protein' || d.category === 'fish') && d.ingredients.length >= 2);
      if (proteinDish && !proteinDish.ingredients.includes('山药')) {
        // 蛋白质已有配菜，不替换（保留原配菜）
      }
      // 山药不单独成菜，只作为搭配；如果没被选中就跳过
    }

    // 4. 豆制品/豆类（每天最多一种豆制品，优先午餐）
    let bean = null;
    let hasBean = false;
    // 午餐已有豆制品或跨餐已有豆制品时，晚餐不再选
    const shouldPickBean = isLunch ? true : (!stapleLegume && !this.hasLegumeSoFar(mealItems) && !crossHasBean);
    if (shouldPickBean) {
      const mealMaxFiber = this.hasHighFiberSoFar(mealItems) ? 'low' : maxFiber;
      bean = this.pickBeanOrLegume(rng, month, usageMap, usedAll(), mealMaxFiber);
      if (bean) {
        const method = this.getCookMethod(rng);
        const isBean = FOOD_DATA.beans.some(b => b.name === bean.name);
        const beanExclude = [...starchyExclude, ...pumpkinCarrotExclude()];
        // 豆制品和全豆都必须有搭配食材，不单独成菜
        // 豆类杂粮主食时优先选山药作为豆制品搭配
        let beanPartner = null;
        if (needYamshan && !this.usedNames(dishes).includes('山药')) {
          const yamshan = FOOD_DATA.sides.find(s => s.name === '山药' && !usedAll().includes('山药') && !beanExclude.includes('山药'));
          if (yamshan) beanPartner = yamshan;
        }
        if (!beanPartner) {
          beanPartner = this.pickBeanPartner(rng, month, usageMap, usedAll().concat(beanExclude), mealMaxFiber);
        }
        // 放宽限制重试
        if (!beanPartner) {
          beanPartner = this.pickBeanPartner(rng, month, usageMap, usedAll().concat(beanExclude), 'high');
        }
        if (!beanPartner) {
          beanPartner = this.pickBeanPartner(rng, month, usageMap, usedAll(), 'high');
        }
        // 没有搭配食材则跳过
        if (!beanPartner) {
          bean = null;
        } else {
          const partnerName = beanPartner.name;
          const dishName = `${partnerName}${bean.name}炖汤`;
          dishes.push({
            name: dishName,
            category: 'bean',
            ingredients: [bean.name, partnerName],
            note: `${method.note}，搭配食材更营养`,
            fiber: bean.fiber,
            legume: true
          });
          if (beanPartner) mealItems.push(beanPartner);
          if (beanPartner && beanPartner.starchy) starchyExclude.push(...allStarchySideNames);
          hasBean = true;
        }
      }
    }

    // 注：独立额外配菜已改为用户手动选择（showSidePicker），系统不再自动生成
    // 保留：主食 + 绿叶菜(+蘑菇搭配) + 蛋白质(+搭配配菜) + 豆制品(+搭配配菜)


    const hasLegumeIngredient = dishes.some(d => (d.ingredients || []).some(i => {
      const all = [...FOOD_DATA.sides, ...FOOD_DATA.legumes, ...FOOD_DATA.beans, ...FOOD_DATA.staples];
      const it = all.find(x => x.name === i);
      return it && it.legume;
    }));

    return {
      mealType: isLunch ? 'lunch' : 'dinner',
      dishes,
      nutritionSummary: {
        protein: dishes.some(d => d.category === 'protein' || d.category === 'fish'),
        vegetables: dishes.some(d => d.category === 'vegetable'),
        staple: true,
        fish: dishes.some(d => d.category === 'fish'),
        beans: hasBean || stapleLegume || hasLegumeIngredient
      }
    };
  }

  // 统计某食材在最近N天内出现的次数
  countIngredientInDays(tasks, dateStr, name, days) {
    const target = new Date(dateStr + 'T00:00:00');
    const cutoff = new Date(target.getTime() - days * 24 * 60 * 60 * 1000);
    let count = 0;
    for (const t of tasks) {
      if (t.module !== 'babyfood') continue;
      const td = new Date(t.date + 'T00:00:00');
      if (td < cutoff || td > target) continue;
      const allDishes = [...(t.content?.lunch?.dishes || []), ...(t.content?.dinner?.dishes || [])];
      for (const d of allDishes) {
        if ((d.ingredients || []).includes(name)) count++;
      }
    }
    return count;
  }

  // 获取最近 N 天内用过的豆类杂粮主食（红豆薏米、绿豆百合、绿豆莲子）
  getRecentLegumeStaples(tasks, dateStr, days) {
    const target = new Date(dateStr + 'T00:00:00');
    const cutoff = new Date(target.getTime() - days * 24 * 60 * 60 * 1000);
    const legumeStaples = ['红豆薏米', '绿豆百合', '绿豆莲子'];
    const found = [];
    for (const t of tasks) {
      if (t.module !== 'babyfood') continue;
      const td = new Date(t.date + 'T00:00:00');
      if (td < cutoff || td > target) continue;
      const allDishes = [...(t.content?.lunch?.dishes || []), ...(t.content?.dinner?.dishes || [])];
      for (const d of allDishes) {
        if (d.category === 'staple' && legumeStaples.includes(d.name) && !found.includes(d.name)) {
          found.push(d.name);
        }
      }
    }
    return found;
  }

  // 统计本周鱼虾出现次数
  countFishThisWeek(tasks, dateStr) {
    const target = new Date(dateStr + 'T00:00:00');
    const dayOfWeek = target.getDay();
    const weekStart = new Date(target.getTime() - dayOfWeek * 24 * 60 * 60 * 1000);
    let count = 0;
    for (const t of tasks) {
      if (t.module !== 'babyfood') continue;
      const td = new Date(t.date + 'T00:00:00');
      if (td < weekStart || td > target) continue;
      const allDishes = [...(t.content?.lunch?.dishes || []), ...(t.content?.dinner?.dishes || [])];
      for (const d of allDishes) {
        if (d.category === 'fish') count++;
      }
    }
    return count;
  }

  async generateDay(dateStr, salt = '', opts = {}) {
    const month = new Date(dateStr + 'T00:00:00').getMonth() + 1;
    const usageMap = await this.getUsageMap();
    const tasks = await storage.getAll('tasks');

    // 频率统计
    const monthGoose = this.countIngredientInDays(tasks, dateStr, '鹅肝', 30);
    const duckDays = this.countIngredientInDays(tasks, dateStr, '鸭肉', 15);
    const lambDays = this.countIngredientInDays(tasks, dateStr, '羊肉', 25);
    const weekFish = this.countFishThisWeek(tasks, dateStr);
    // 豆类杂粮主食 10 天内用过的记录
    const legumeStapleRecent = this.getRecentLegumeStaples(tasks, dateStr, 10);

    const freqStats = { monthGoose, duckDays, lambDays, weekFish, legumeStapleRecent };
    const seedBase = dateStr + salt;

    // 如果保留了午餐，直接使用；否则生成午餐
    let lunch, dinnerCrossData;
    if (opts.keepLunch) {
      lunch = opts.keepLunch;
    } else {
      lunch = this.generateMeal(seedBase + '-lunch', month, usageMap, {
        isLunch: true,
        freqStats: { ...freqStats }
      });
    }

    // 收集午餐跨餐数据（用于晚餐去重）
    const lunchAllIng = lunch.dishes.flatMap(d => d.ingredients || []);
    const lunchNonMeat = lunchAllIng.filter(name =>
      !FOOD_DATA.proteins.some(p => p.name === name)
    );
    const allSides = FOOD_DATA.sides;
    const lunchStarchy = lunchAllIng.filter(name => {
      const item = allSides.find(s => s.name === name);
      return item && item.starchy;
    });
    const lunchHasPumpkin = lunchAllIng.includes('南瓜');
    const lunchHasCarrot = lunchAllIng.includes('胡萝卜');
    const lunchHasBean = lunch.dishes.some(d => d.category === 'bean');

    // 更新频率统计（如果午餐选了特殊蛋白质）
    let dinnerFreq = { ...freqStats };
    const lunchProteinDish = lunch.dishes.find(d => d.category === 'protein' || d.category === 'fish');
    if (lunchProteinDish) {
      const proteinName = lunchProteinDish.ingredients[0];
      if (proteinName === '鹅肝') dinnerFreq.monthGoose++;
      if (proteinName === '鸭肉') dinnerFreq.duckDays++;
      if (proteinName === '羊肉') dinnerFreq.lambDays++;
      if (lunchProteinDish.category === 'fish') dinnerFreq.weekFish++;
    }

    // 如果保留了晚餐，直接使用；否则生成晚餐（考虑午餐跨餐去重）
    let dinner;
    if (opts.keepDinner) {
      dinner = opts.keepDinner;
    } else {
      dinner = this.generateMeal(seedBase + '-dinner', month, usageMap, {
        isLunch: false,
        usedStaple: lunch.dishes.find(d => d.category === 'staple'),
        freqStats: dinnerFreq,
        crossMealUsed: lunchNonMeat,
        crossStarchyUsed: lunchStarchy,
        crossHasPumpkin: lunchHasPumpkin,
        crossHasCarrot: lunchHasCarrot,
        crossHasBean: lunchHasBean
      });
    }

    // 如果保留了晚餐但重新生成了午餐，需要确保午餐也考虑晚餐的跨餐去重
    // 这��情况较少（通常是编辑了午餐后只重新生成晚餐），暂不处理反向去重

    return { lunch, dinner };
  }

}

const app = {
  currentModule: 'english',

  async init() {
    await storage.init();

  async ensureDefaultData() {
    // 初始化词库

    if (!words.length) {
      for (const w of DEFAULT_WORD_BANK) {
        await storage.put('words', {id:uuid(), ...w, reviewCount:0, lastReviewed:null, mistakeCount:0, createdAt:new Date().toISOString(), userAdded:false});
      }
    }
    // 修复历史错误日期：旧版本换词/换诗会把日期改成 2000-01-01
    // 旧版本用 toISOString() 可能导致凌晨时段日期差一天
    // 只修复明显错误的日期（2000年），不改动其他任务的日期
    const allTasks = await storage.getAll('tasks');
    for (const t of allTasks) {
      if (!t.createdAt) continue;
      // 修复 2000-01-01（旧版本换词/换诗的错误日期）
      if (t.date === '2000-01-01' || (t.date && t.date.startsWith('2000-'))) {
        t.date = fmtDate(new Date(t.createdAt));
        t.updatedAt = new Date().toISOString();
        await storage.put('tasks', t);

  // 侧边栏管理
  openSidebarManager() {

                 : `<button class="btn btn-ghost" onclick="app.deleteCustomModule('${m.id}')">删除</button>`}

      const fixed = FIXED_MODULES.find(m => m.id === id);
      item = fixed ? {id:fixed.id, name:fixed.name, icon:fixed.icon, visible:true} : {id, name:'', icon:'', visible:true};

    cfg.customModules.push({id:'custom-'+Date.now(), name, icon, visible:true});

    this.renderSidebar();

/* ================= 任务管理器 ================= */

const taskManager = {
  expandedDates: new Set(),

  getExpandedDates() {
    const cfg = getConfig();
    return new Set(Object.keys(cfg.expandedDates || {}).filter(k => cfg.expandedDates[k]));
  },

  saveExpandedDates() {
    const cfg = getConfig();
    cfg.expandedDates = {};
    this.expandedDates.forEach(d => cfg.expandedDates[d] = true);
    saveConfig(cfg);
  },

  init() {
    this.expandedDates = this.getExpandedDates();
  },

  async getTasksByModule(moduleId) {
    return (await storage.getByIndex('tasks', 'module', moduleId)).sort((a,b) => b.date.localeCompare(a.date) || new Date(b.createdAt)-new Date(a.createdAt));
  },

  groupByDate(tasks) {
    const map = {};
    tasks.forEach(t => { (map[t.date] ||= []).push(t); });
    return map;
  },

  renderDateGroups(tasks, renderTaskFn, emptyHtml='') {
    if (!tasks.length) return emptyHtml || app.renderEmpty('📋','暂无任务','添加或自动生成任务后会显示在这里');
    const grouped = this.groupByDate(tasks);
    let html = '';
    for (const [date, list] of Object.entries(grouped)) {
      const isExpanded = this.expandedDates.has(date);
      const completed = list.filter(t=>t.completed).length;
      html += `<div class="date-group ${isExpanded?'expanded':''}">
        <div class="date-header" onclick="taskManager.toggleDate('${date}')">
          <span class="date-label">${formatDateLabel(date)}</span>
          <span class="date-progress">${completed}/${list.length} 完成</span>
          <span class="toggle-icon">${isExpanded?'▾':'▸'}</span>
        </div>
        <div class="date-tasks">${list.map(t => renderTaskFn(t)).join('')}</div>
      </div>`;
    }
    return html;
  },

  toggleDate(date) {
    if (this.expandedDates.has(date)) this.expandedDates.delete(date);
    else this.expandedDates.add(date);
    this.saveExpandedDates();
    router.handle();
  },

  async toggleTaskComplete(id) {
    const t = await storage.get('tasks', id);
    if (!t) return;
    t.completed = !t.completed;
    t.completedAt = t.completed ? new Date().toISOString() : null;
    t.updatedAt = new Date().toISOString();
    await storage.put('tasks', t);
    router.handle();
    showToast(t.completed ? '任务已完成' : '已恢复任务');
  },

  async saveTaskInput(id) {
    // 自定义模块任务输入框保存
    const t = await storage.get('tasks', id);
    if (!t) return;
    const input = document.querySelector(`[data-task-id="${id}"] .task-textarea`);
    if (input) t.content.text = input.value;
    t.updatedAt = new Date().toISOString();
    await storage.put('tasks', t);
  },

  renderTaskCheckbox(t) {
    return `<div class="task-item ${t.completed?'completed':''}" data-task-id="${t.id}">
      <div class="task-checkbox ${t.completed?'checked':''}" onclick="taskManager.toggleTaskComplete('${t.id}')">${t.completed?'✓':''}</div>
      <div class="task-content">
        <div class="task-title">${escapeHtml(t.title)}</div>
        <div class="task-meta">${this.renderTaskMeta(t)}</div>
      </div>
    </div>`;
  },

  renderTaskMeta(t) {
    if (t.module === 'english') {
      const c = t.content;
      return `单词复习 ${c.reviewedCount || 0}/${c.words.length}`;
    }
    if (t.module === 'babyfood') {
      const c = t.content;
      return `${c.dishes.map(d=>d.name).join('、')}`;
    }
    return escapeHtml(t.content?.text || '');
  }
};

      examples.push({en:`I saw a ${en} at the zoo.`, zh:`我在动物园看到了一只${zh}。`});

      examples.push({en:`My favorite color is ${en}.`, zh:`我最喜欢的颜色是${zh}。`});
      examples.push({en:`She has ${en} eyes.`, zh:`她有${zh}色的眼睛。`});

      examples.push({en:`There are ${en} birds in the tree.`, zh:`树上有${zh}只鸟。`});

      examples.push({en:`My ${en} is hurting.`, zh:`我的${zh}疼。`});
    } else if (cat === 'family') {
      examples.push({en:`My ${en} loves me very much.`, zh:`我的${zh}很爱我。`});
      examples.push({en:`This is my ${en}.`, zh:`这是我的${zh}。`});

    } else if (cat === 'adj') {
      examples.push({en:`Look at the ${en} elephant!`, zh:`看那只${zh}的大象！`});
      examples.push({en:`The flower is ${en}.`, zh:`这朵花是${zh}的。`});
    } else if (cat === 'weather') {
      // 天气类包含天气现象(sunny/rainy)、季节(spring/summer)、温度词(warm/cool)等
      const isSeason = ['spring','summer','autumn','winter'].includes(en.toLowerCase());
      const isAdj = ['sunny','rainy','cloudy','windy','snowy','warm','cool','foggy','humid','dry'].includes(en.toLowerCase());
