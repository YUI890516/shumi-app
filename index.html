const goldModule = {
  _timer: null,
  _cache: null,
  _cacheTime: 0,
  // 招行积存金买卖价差（元/克），银行通常加价1-2元
  SPREAD: 1.5,
  // 持仓数据存储 key
  HOLDINGS_KEY: 'gold_holdings',

  async init() {
    this.fetchGold();
    if (this._timer) clearInterval(this._timer);
    this._timer = setInterval(() => this.fetchGold(), 30 * 1000); // 每30秒刷新收益
  },

  async fetchGold() {
    const bar = $('gold-bar');
    if (!bar && !app) return;

    const now = Date.now();
    if (this._cache && now - this._cacheTime < 15000) {
      this.renderBar(this._cache);
      return;
    }

    try {
      // 尝试多个数据源：本地代理 → cors.sh → allorigins
      const targetUrl = 'https://m.cmbchina.com/api/rate/gold';
      const proxies = [
        '/api/gold',
        'https://proxy.cors.sh/' + targetUrl,
        'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl)
      ];
      let res = null;
      for (const url of proxies) {
        try {
          res = await fetch(url);
          if (res && res.ok) break;
        } catch(e) { res = null; }
      }
      if (!res || !res.ok) throw new Error('所有代理均不可用');
      const json = await res.json();
      if (json.returnCode === 'SUC0000' && json.body && json.body.data) {
        // 找 Au99.99（招行积存金参考价）
        const au9999 = json.body.data.find(d => d.goldNo === 'AU9999');
        const auTD = json.body.data.find(d => d.goldNo === 'AUTD');
        const goldItem = (au9999 && parseFloat(au9999.curPrice) > 0) ? au9999 : auTD;
        if (goldItem && parseFloat(goldItem.curPrice) > 0) {
          const price = parseFloat(goldItem.curPrice);
          const upDown = parseFloat(goldItem.upDown);
          const preClose = parseFloat(goldItem.preClose);
          const data = {
            price, upDown, preClose,
            buyPrice: price + this.SPREAD,      // 买入价（银行卖给你）
            sellPrice: price - this.SPREAD,     // 卖出价（银行回收）
            time: json.body.time,
            change: upDown,
            changePct: preClose > 0 ? (upDown / preClose * 100) : 0
          };
          this._cache = data;
          this._cacheTime = now;
          this.renderBar(data);
          // 如果当前在黄金模块页面，也刷新模块内容
          if (app.currentModule === 'gold') this.render();
        }
      }
    } catch(e) {
      console.warn('Gold fetch failed', e);
    }
  },

  // 渲染顶部黄金价格栏
  // 获取金价卡片HTML（供 aqiModule 调用）
  getGoldCardHtml() {
    if (!this._cache) return '';
    const d = this._cache;
    const isUp = d.upDown >= 0;
    const color = isUp ? '#E53935' : '#43A047';
    const arrow = isUp ? '↑' : '↓';
    return `<div class="aqi-card" style="background:rgba(229,57,53,0.06);">
      <div class="aqi-card-source">🪙 招行黄金买入价</div>
      <div class="aqi-card-value-row">
        <div class="aqi-card-value" style="color:var(--ios-primary);font-size:18px;">¥${d.buyPrice.toFixed(2)}</div>
        <div class="aqi-card-level" style="color:${color};">${arrow}${Math.abs(d.upDown).toFixed(2)}</div>
      </div>
      <div class="aqi-card-pollutant">Au99.99 · ${d.time || ''}</div>
    </div>`;
  },

  renderBar(data) {
    // 金价卡片现在渲染到 aqi-bar（由 aqiModule.render 统一渲染）
    // 触发 aqiModule 重新渲染（如果 AQI 数据已有）
    if (aqiModule._cache) {
      aqiModule.render(aqiModule._cache);
    }
  },

  // ===== 持仓管理 =====

  getHoldings() {
    try {
      return JSON.parse(localStorage.getItem(this.HOLDINGS_KEY) || '[]');
    } catch(e) { return []; }
  },

  saveHoldings(holdings) {
    localStorage.setItem(this.HOLDINGS_KEY, JSON.stringify(holdings));
  },

  // 计算持仓汇总
  getSummary(holdings, currentPrice) {
    let totalGrams = 0, totalCost = 0;
    holdings.forEach(h => {
      totalGrams += h.grams;
      totalCost += h.grams * h.price;
    });
    const avgPrice = totalGrams > 0 ? totalCost / totalGrams : 0;
    const currentValue = totalGrams * currentPrice;
    const profit = currentValue - totalCost;
    const profitPct = totalCost > 0 ? (profit / totalCost * 100) : 0;
    return { totalGrams, avgPrice, totalCost, currentValue, profit, profitPct };
  },

  async render() {
    app.setTitle('黄金投资');
    const holdings = this.getHoldings();
    const price = this._cache ? this._cache.sellPrice : 0;
    const buyPrice = this._cache ? this._cache.buyPrice : 0;
    const summary = this.getSummary(holdings, price);

    let html = '';

    // 实时金价卡片
    if (this._cache) {
      const d = this._cache;
      const isUp = d.upDown >= 0;
      const color = isUp ? '#FF3B30' : '#34C759';
      html += `<div class="card" style="border-left:4px solid #FF9500;">
        <div class="card-header">
          <span style="font-size:20px;">🪙</span>
          <span style="margin-left:6px;">招商银行黄金 · 实时行情</span>
        </div>
        <div class="card-body">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div>
              <div style="font-size:12px;color:var(--ios-text-secondary);">买入价（银行卖出）</div>
              <div style="font-size:28px;font-weight:700;color:#FF9500;">¥${d.buyPrice.toFixed(2)}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:12px;color:var(--ios-text-secondary);">卖出价（银行回购）</div>
              <div style="font-size:20px;font-weight:700;color:var(--ios-text);">¥${d.sellPrice.toFixed(2)}</div>
            </div>
          </div>
          <div style="display:flex;gap:12px;font-size:13px;color:var(--ios-text-secondary);border-top:1px solid var(--ios-separator-light);padding-top:8px;">
            <span>基准 Au99.99: ¥${d.price.toFixed(2)}</span>
            <span style="color:${color};">${isUp?'↑':'↓'} ${Math.abs(d.upDown).toFixed(2)} (${d.changePct.toFixed(2)}%)</span>
            <span>昨收: ¥${d.preClose.toFixed(2)}</span>
          </div>
          <div style="font-size:11px;color:var(--ios-text-secondary);margin-top:6px;">更新: ${d.time || '—'} · 价差${this.SPREAD}元/克</div>
        </div>
      </div>`;
    } else {
      html += `<div class="card"><div class="card-body"><div style="text-align:center;padding:20px;color:var(--ios-text-secondary);">获取金价中...</div></div></div>`;
    }

    // 持仓汇总卡片
    if (holdings.length > 0) {
      const profitColor = summary.profit >= 0 ? '#FF3B30' : '#34C759';
      html += `<div class="card" style="border-left:4px solid ${profitColor};">
        <div class="card-header">
          <span style="font-size:20px;">📊</span>
          <span style="margin-left:6px;">持仓汇总</span>
        </div>
        <div class="card-body">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div style="background:rgba(0,122,255,0.05);border-radius:8px;padding:10px 12px;">
              <div style="font-size:12px;color:var(--ios-text-secondary);">持有克数</div>
              <div style="font-size:22px;font-weight:700;">${summary.totalGrams.toFixed(2)}g</div>
            </div>
            <div style="background:rgba(0,122,255,0.05);border-radius:8px;padding:10px 12px;">
              <div style="font-size:12px;color:var(--ios-text-secondary);">均价</div>
              <div style="font-size:22px;font-weight:700;">¥${summary.avgPrice.toFixed(2)}</div>
            </div>
            <div style="background:rgba(0,122,255,0.05);border-radius:8px;padding:10px 12px;">
              <div style="font-size:12px;color:var(--ios-text-secondary);">当前市值</div>
              <div style="font-size:18px;font-weight:700;">¥${summary.currentValue.toFixed(2)}</div>
            </div>
            <div style="background:rgba(0,122,255,0.05);border-radius:8px;padding:10px 12px;">
              <div style="font-size:12px;color:var(--ios-text-secondary);">总成本</div>
              <div style="font-size:18px;font-weight:700;">¥${summary.totalCost.toFixed(2)}</div>
            </div>
          </div>
          <div style="margin-top:12px;padding:12px;border-radius:8px;background:${profitColor === '#FF3B30' ? 'rgba(255,59,48,0.08)' : 'rgba(52,199,89,0.08)'};text-align:center;">
            <div style="font-size:13px;color:var(--ios-text-secondary);">浮动盈亏</div>
            <div style="font-size:28px;font-weight:700;color:${profitColor};">
              ${summary.profit >= 0 ? '+' : ''}¥${summary.profit.toFixed(2)}
              <span style="font-size:16px;">(${summary.profitPct >= 0 ? '+' : ''}${summary.profitPct.toFixed(2)}%)</span>
            </div>
          </div>
        </div>
      </div>`;
    }

    // 买入记录列表
    html += `<div class="card">
      <div class="card-header">
        <span style="font-size:20px;">📝</span>
        <span style="margin-left:6px;">买入记录</span>
        <button class="btn btn-yellow" style="margin-left:auto;padding:4px 12px;font-size:13px;" onclick="goldModule.showAddForm()">+ 添加</button>
      </div>
      <div class="card-body">`;

    if (holdings.length === 0) {
      html += `<div style="text-align:center;padding:20px;color:var(--ios-text-secondary);">暂无买入记录<br><span style="font-size:12px;">点击右上角"+ 添加"记录每次买入</span></div>`;
    } else {
      holdings.forEach((h, i) => {
        const profit = (price - h.price) * h.grams;
        const profitColor = profit >= 0 ? '#FF3B30' : '#34C759';
        html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ios-separator-light);">
          <div>
            <div style="font-size:15px;font-weight:600;">${h.grams.toFixed(2)}g @ ¥${h.price.toFixed(2)}</div>
            <div style="font-size:12px;color:var(--ios-text-secondary);">${h.date} · 成本 ¥${(h.grams*h.price).toFixed(2)}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:14px;font-weight:600;color:${profitColor};">${profit >= 0 ? '+' : ''}¥${profit.toFixed(2)}</div>
            <button onclick="goldModule.deleteHolding(${i})" style="font-size:11px;color:var(--ios-red);background:none;border:none;cursor:pointer;margin-top:2px;">删除</button>
          </div>
        </div>`;
      });
    }
    html += `</div></div>`;

    // 说明
    html += `<div class="card">
      <div class="card-body">
        <div style="font-size:13px;color:var(--ios-text-secondary);line-height:1.6;">
          <b>说明：</b><br>
          • 金价来源：招商银行上海金交所 Au99.99 实时行情<br>
          • 买入价 = 基准价 + ${this.SPREAD}元/克（银行卖出价）<br>
          • 卖出价 = 基准价 - ${this.SPREAD}元/克（银行回购价）<br>
          • 实际买卖价以招行 APP 为准，此处仅供参考<br>
          • 数据每分钟自动刷新
        </div>
      </div>
    </div>`;

    $('content').innerHTML = html;
  },

  // 显示添加买入记录表单
  showAddForm() {
    const todayPrice = this._cache ? this._cache.buyPrice : 0;
    const body = `
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:14px;margin-bottom:6px;color:var(--ios-text-secondary);">买入克数（克）</label>
        <input id="gold-add-grams" type="number" step="0.01" placeholder="例如: 5.00" style="width:100%;padding:10px;border:1px solid var(--ios-separator);border-radius:8px;font-size:16px;" />
      </div>
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:14px;margin-bottom:6px;color:var(--ios-text-secondary);">买入单价（元/克）</label>
        <input id="gold-add-price" type="number" step="0.01" value="${todayPrice.toFixed(2)}" placeholder="例如: ${todayPrice.toFixed(2)}" style="width:100%;padding:10px;border:1px solid var(--ios-separator);border-radius:8px;font-size:16px;" />
      </div>
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:14px;margin-bottom:6px;color:var(--ios-text-secondary);">买入日期</label>
        <input id="gold-add-date" type="date" value="${new Date().toISOString().slice(0,10)}" style="width:100%;padding:10px;border:1px solid var(--ios-separator);border-radius:8px;font-size:16px;" />
      </div>
    `;
    app.showModal('添加买入记录', body, `
      <button class="btn btn-secondary" onclick="app.hideModal()">取消</button>
      <button class="btn btn-primary" onclick="goldModule.saveAddForm()">保存</button>
    `);
  },

  saveAddForm() {
    const grams = parseFloat($('gold-add-grams').value);
    const price = parseFloat($('gold-add-price').value);
    const date = $('gold-add-date').value;
    if (!grams || grams <= 0 || !price || price <= 0) {
      showToast('请输入有效的克数和单价');
      return;
    }
    const holdings = this.getHoldings();
    holdings.push({ grams, price, date, createdAt: Date.now() });
    this.saveHoldings(holdings);
    app.hideModal();
    this.render();
    showToast('✓ 已添加买入记录');
  },

  deleteHolding(idx) {
    const holdings = this.getHoldings();
    if (idx >= 0 && idx < holdings.length) {
      holdings.splice(idx, 1);
      this.saveHoldings(holdings);
      this.render();
      showToast('已删除');
    }
  }
};

const settingsModule = {
  render() {
    app.setTitle('设置');
    const cfg = getConfig();
    const status = syncManager.getStatus();
    let html = `<div class="card">
      <div class="card-header">云端同步 (Supabase)</div>
      <div class="card-body">
        <div class="connection-badge ${status}" style="margin-bottom:14px;">
          <span class="connection-dot"></span>
          ${status==='local'?'仅本地存储':status==='offline'?'离线（已保存本地）':'已连接云端'}
        </div>
        <p style="font-size:13px;color:var(--ios-text-secondary);margin-bottom:12px;">
          先在 <a href="https://supabase.com" target="_blank">supabase.com</a> 注册项目，在 Project Settings 中复制 URL 和 anon public key 填入下方，即可启用多设备同步。
        </p>
        <div class="form-group"><label class="form-label">Supabase URL</label><input class="form-input" id="sb-url" value="${escapeHtml(cfg.supabase.url)}" placeholder="https://xxxxx.supabase.co"></div>
        <div class="form-group"><label class="form-label">Anon Key</label><input class="form-input" id="sb-key" type="password" value="${escapeHtml(cfg.supabase.anonKey)}" placeholder="eyJhbGciOi..."></div>
        <button class="btn btn-primary" onclick="settingsModule.enableSync()">启用云端同步</button>
        ${cfg.supabase.lastSync ? `<p style="margin-top:10px;font-size:13px;color:var(--ios-text-secondary);">上次同步：${new Date(cfg.supabase.lastSync).toLocaleString()}</p>` : ''}
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header">数据库建表 SQL（复制到 Supabase SQL Editor）</div>
      <div class="card-body">
        <textarea class="form-textarea" readonly style="font-family:monospace;font-size:12px;min-height:200px;" onclick="this.select()">${this.getSQL()}</textarea>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header">数据管理</div>
      <div class="card-body no-padding">
        <div class="setting-item">
          <div><div class="setting-label">导出所有数据</div><div class="setting-desc">下载 JSON 备份文件</div></div>
          <button class="btn btn-secondary" onclick="settingsModule.exportData()">导出</button>
        </div>
        <div class="setting-item">
          <div><div class="setting-label">导入数据</div><div class="setting-desc">从 JSON 备份文件恢复</div></div>
          <button class="btn btn-secondary" onclick="settingsModule.importData()">导入</button>
        </div>
        <div class="setting-item">
          <div><div class="setting-label" style="color:var(--ios-red)">清除所有数据</div><div class="setting-desc">删除本地全部任务和词库，不可恢复</div></div>
          <button class="btn btn-danger" onclick="settingsModule.clearAll()">清除</button>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header">空气质量数据源（海宁/嘉兴）</div>
      <div class="card-body">
        <p style="font-size:13px;color:var(--ios-text-secondary);margin-bottom:12px;">
          在意空气和中国国控站无需配置即可使用。IQAir智空气需填写 API Key，在 <a href="https://www.iqair.com/dashboard/api" target="_blank">IQAir</a> 免费注册获取。所有数据均为美标AQI。
        </p>
        <div class="form-group"><label class="form-label">IQAir API Key</label><input class="form-input" id="iqair-key" type="password" value="${escapeHtml(localStorage.getItem('iqair_api_key')||'')}" placeholder="填入 IQAir API Key 后点击保存"></div>
        <button class="btn btn-primary" onclick="settingsModule.saveIQAirKey()">保存并刷新</button>
      </div>
    </div>

    
    <input type="file" id="import-file" class="hidden" accept=".json" onchange="settingsModule.handleImport(event)">
    `;
    $('content').innerHTML = html;
  },

  saveIQAirKey() {
    const key = $('iqair-key').value.trim();
    if (key) localStorage.setItem('iqair_api_key', key);
    else localStorage.removeItem('iqair_api_key');
    showToast('已保存');
    aqiModule._cache = null;
    aqiModule.fetch();
  },


  getSQL() {
    return `CREATE TABLE IF NOT EXISTS workbench_tasks (
  id UUID PRIMARY KEY,
  user_id TEXT NOT NULL,
  data JSONB NOT NULL,
  updated_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE IF NOT EXISTS workbench_words (
  id UUID PRIMARY KEY,
  user_id TEXT NOT NULL,
  data JSONB NOT NULL,
  updated_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE IF NOT EXISTS workbench_custom_modules (
  id UUID PRIMARY KEY,
  user_id TEXT NOT NULL,
  data JSONB NOT NULL,
  updated_at TIMESTAMPTZ DEFAULT NOW()
);

ALTER TABLE workbench_tasks ENABLE ROW LEVEL SECURITY;
ALTER TABLE workbench_words ENABLE ROW LEVEL SECURITY;
ALTER TABLE workbench_custom_modules ENABLE ROW LEVEL SECURITY;

CREATE POLICY "own_tasks" ON workbench_tasks FOR ALL USING (user_id = auth.uid());
CREATE POLICY "own_words" ON workbench_words FOR ALL USING (user_id = auth.uid());
CREATE POLICY "own_modules" ON workbench_custom_modules FOR ALL USING (user_id = auth.uid());`;
  },

  async enableSync() {
    const url = $('sb-url').value.trim();
    const key = $('sb-key').value.trim();
    if (!url || !key) return showToast('请填写 URL 和 Key');
    try {
      await syncManager.enable(url, key);
      showToast('云端同步已启用');
      this.render();
    } catch(e) {
      showToast('连接失败：' + e.message);
    }
  },

  async exportData() {
    const data = {
      config: getConfig(),
      tasks: await storage.getAll('tasks'),
      words: await storage.getAll('words'),
      customModules: await storage.getAll('custom_modules')
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `workbench-backup-${todayStr()}.json`;
    a.click();
    showToast('导出成功');
  },

  importData() { $('import-file').click(); },

  async handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    try {
      const data = JSON.parse(text);
      if (data.config) saveConfig(data.config);
      if (data.tasks) for (const t of data.tasks) await storage.put('tasks', t);
      if (data.words) for (const w of data.words) await storage.put('words', w);
      if (data.customModules) for (const m of data.customModules) await storage.put('custom_modules', m);
      showToast('导入成功');
      router.handle();
    } catch(err) {
      showToast('导入失败：' + err.message);
    }
  },

  async clearAll() {
    if (!confirm('确定删除所有本地数据吗？此操作不可恢复。')) return;
    localStorage.removeItem(CONFIG_KEY);
    const db = storage.db;
    if (db) {
      await new Promise((res,rej)=>{const r=db.transaction(['tasks'],'readwrite').objectStore('tasks').clear();r.onsuccess=res;r.onerror=rej;});
      await new Promise((res,rej)=>{const r=db.transaction(['words'],'readwrite').objectStore('words').clear();r.onsuccess=res;r.onerror=rej;});
    }
    location.reload();
  }
};

/* ================= 启动 ================= */

document.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
