  async generateDailyTask(date, forceFresh=false) {
    const all = await storage.getAll('words');
    // 先按复习次数和间隔排序
    const sorted = all.sort((a,b) => {
      if (a.reviewCount === 0 && b.reviewCount > 0) return -1;
      if (b.reviewCount === 0 && a.reviewCount > 0) return 1;
      if (a.reviewCount !== b.reviewCount) return a.reviewCount - b.reviewCount;
      const ga = a.lastReviewed ? Date.now() - new Date(a.lastReviewed).getTime() : Infinity;
      const gb = b.lastReviewed ? Date.now() - new Date(b.lastReviewed).getTime() : Infinity;
      return gb - ga;
    });
    // 从优先级高的候选池中随机选取，避免每次都选同样的词
    // 取前 40 个作为候选池（覆盖未复习和复习次数少的）
    const pool = sorted.slice(0, Math.min(40, sorted.length));
    // Fisher-Yates 随机打乱候选池
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const selected = pool.slice(0, Math.min(5, pool.length));
    const task = {
      id: uuid(), date, module:'english', type:'word_review',
      title:'今日单词复习',
      content: {
        words: selected.map(w => ({en:w.en, zh:w.zh, reviewed:false, revealed:false, wordId:w.id, examples: this._generateExamples(w)})),
        reviewedCount: 0
      },
      completed: false, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
    };
    await storage.put('tasks', task);
    return task;
  },

  speakWord(text) {
    if (!('speechSynthesis' in window)) return showToast('当前设备不支持语音');
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.8;
    const voices = speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en'));
    if (enVoice) u.voice = enVoice;
    speechSynthesis.speak(u);
  },

  async flipCard(el, taskId, idx) {
    const t = await storage.get('tasks', taskId);
    if (!t) return;
    t.content.words[idx].revealed = !t.content.words[idx].revealed;
    t.updatedAt = new Date().toISOString();
    await storage.put('tasks', t);
    const zh = el.querySelector('.word-zh');
    zh.classList.toggle('hidden');
  },

  async markReviewed(taskId, idx) {
    const t = await storage.get('tasks', taskId);
    if (!t) return;
    const w = t.content.words[idx];
    if (w.reviewed) return;
    w.reviewed = true; w.revealed = true;
    t.content.reviewedCount = t.content.words.filter(x=>x.reviewed).length;
    t.completed = t.content.reviewedCount === t.content.words.length;
    t.completedAt = t.completed ? new Date().toISOString() : null;
    t.updatedAt = new Date().toISOString();

    // 更新单词复习统计
    if (w.wordId) {
      const word = await storage.get('words', w.wordId);
      if (word) {
        word.reviewCount++;
        word.lastReviewed = new Date().toISOString();
        await storage.put('words', word);
      }
    }

    await storage.put('tasks', t);
    this.render();
    showToast('已标记掌握');
  },

  async generateNewTask() {
    if (!confirm('确定换一批单词吗？当前进度会保留为历史。')) return;
    const today = todayStr();
    const tasks = await taskManager.getTasksByModule('english');
    const todayTask = tasks.find(t => t.date === today && t.type === 'word_review');
    if (todayTask) {
      // 旧任务保持今天的日期，只标记为已替换，移入历史
      todayTask.title = '单词复习 (已替换)';
      todayTask.type = 'word_review_replaced'; // 改类型，避免和今天的新任务冲突
      todayTask.updatedAt = new Date().toISOString();
      await storage.put('tasks', todayTask);
    }
    // 生成全新的一批单词（随机选取）
    await this.generateDailyTask(today);
    this.render();
    showToast('已换一批新单词');
  },

  openWordManager() {
    this.renderWordManager();
  },

  async renderWordManager() {
    const words = await storage.getAll('words');
    const grades = [1,2,3,4,5,6];
    const cats = [...new Set(words.map(w=>w.category))].sort();
    let body = `<div class="toolbar">
      <input class="form-input" id="word-search" placeholder="搜索单词或中文" style="flex:1;" oninput="englishModule.filterWords()">
      <select class="form-select" id="word-grade" onchange="englishModule.filterWords()" style="width:100px;">
        <option value="">全部年级</option>${grades.map(g=>`<option value="${g}">${g}年级</option>`).join('')}
      </select>
      <select class="form-select" id="word-cat" onchange="englishModule.filterWords()" style="width:110px;">
        <option value="">全部分类</option>${cats.map(c=>`<option value="${c}">${c}</option>`).join('')}
      </select>
      <button class="btn btn-primary" onclick="englishModule.showAddWord()">+ 添加</button>
    </div>
    <div id="word-list" class="card" style="margin-top:8px;"><div class="card-body no-padding">`;
    body += this.renderWordListHtml(words);
    body += `</div></div>`;
    app.showModal('词库管理', body, `<button class="btn btn-secondary" onclick="app.hideModal()">关闭</button>`);
    this.allWords = words;
  },

  renderWordListHtml(words) {
    if (!words.length) return '<div class="empty-state">未找到单词</div>';
    return words.map(w => `<div class="list-row" data-grade="${w.grade}" data-cat="${w.category}" data-q="${(w.en+' '+w.zh).toLowerCase()}">
      <div class="list-content">
        <div class="list-title">${escapeHtml(w.en)} <span style="color:var(--ios-text-secondary);font-weight:400;">- ${escapeHtml(w.zh)}</span></div>
        <div class="list-subtitle">${w.grade}年级 · ${w.category} · 复习${w.reviewCount}次</div>
      </div>
      <button class="btn btn-ghost" onclick="englishModule.editWord('${w.id}')">编辑</button>
      ${w.userAdded ? `<button class="btn btn-ghost" style="color:var(--ios-red);" onclick="englishModule.deleteWord('${w.id}')">删除</button>` : ''}
    </div>`).join('');
  },

  filterWords() {
    const q = ($('word-search').value || '').toLowerCase();
    const g = $('word-grade').value;
    const c = $('word-cat').value;
    let filtered = this.allWords;
    if (q) filtered = filtered.filter(w => (w.en+' '+w.zh).toLowerCase().includes(q));
    if (g) filtered = filtered.filter(w => w.grade == g);
    if (c) filtered = filtered.filter(w => w.category === c);
    $('word-list').innerHTML = '<div class="card-body no-padding">' + this.renderWordListHtml(filtered) + '</div>';
  },

  showAddWord() {
    const body = `<div class="form-group"><label class="form-label">英文</label><input class="form-input" id="edit-en"></div>
      <div class="form-group"><label class="form-label">中文</label><input class="form-input" id="edit-zh"></div>
      <div class="form-group"><label class="form-label">年级</label><select class="form-select" id="edit-grade">${[1,2,3,4,5,6].map(g=>`<option value="${g}">${g}年级</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">分类</label><input class="form-input" id="edit-cat" placeholder="如 food animal color"></div>`;
    app.showModal('添加单词', body, `
      <button class="btn btn-secondary" onclick="app.hideModal()">取消</button>
      <button class="btn btn-primary" onclick="englishModule.saveWord()">保存</button>
    `);
  },

  async saveWord() {
    const en = $('edit-en').value.trim();
    const zh = $('edit-zh').value.trim();
    const grade = parseInt($('edit-grade').value) || 1;
    const cat = ($('edit-cat').value || 'custom').trim();
    if (!en || !zh) return showToast('请填写英文和中文');
    await storage.put('words', {id:uuid(), en, zh, grade, category:cat, reviewCount:0, lastReviewed:null, mistakeCount:0, createdAt:new Date().toISOString(), userAdded:true});
    app.hideModal();
    showToast('单词已添加');
    this.renderWordManager();
  },

  async editWord(id) {
    const w = await storage.get('words', id);
    if (!w) return;
    const body = `<div class="form-group"><label class="form-label">英文</label><input class="form-input" id="edit-en" value="${escapeHtml(w.en)}"></div>
      <div class="form-group"><label class="form-label">中文</label><input class="form-input" id="edit-zh" value="${escapeHtml(w.zh)}"></div>
      <div class="form-group"><label class="form-label">年级</label><select class="form-select" id="edit-grade">${[1,2,3,4,5,6].map(g=>`<option value="${g}" ${w.grade==g?'selected':''}>${g}年级</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">分类</label><input class="form-input" id="edit-cat" value="${escapeHtml(w.category)}"></div>`;
    app.showModal('编辑单词', body, `
      <button class="btn btn-secondary" onclick="app.hideModal()">取消</button>
      <button class="btn btn-primary" onclick="englishModule.updateWord('${w.id}')">保存</button>
    `);
  },

  async updateWord(id) {
    const w = await storage.get('words', id);
    w.en = $('edit-en').value.trim();
    w.zh = $('edit-zh').value.trim();
    w.grade = parseInt($('edit-grade').value) || 1;
    w.category = ($('edit-cat').value || 'custom').trim();
    await storage.put('words', w);
    app.hideModal();
    showToast('单词已更新');
    this.renderWordManager();
  },

  async deleteWord(id) {
    if (!confirm('确定删除这个单词吗？')) return;
    await storage.delete('words', id);
    this.renderWordManager();
  }
};

/* ================= 宝宝辅食模块 ================= */

const babyfoodModule = {
  async render() {
    app.setTitle('宝宝辅食');
    const today = todayStr();
    const tasks = await taskManager.getTasksByModule('babyfood');
    let todayTasks = tasks.filter(t => t.date === today);

    let html = '';
    // 确保今天有午餐和晚餐任务（空白餐卡，用户手动选择）
    // 旧版本自动生成的食谱没有 blank 标记，需要替换为空白餐卡
    const ensureMealTasks = async () => {
      const types = ['lunch', 'dinner'];
      for (const type of types) {
        const existing = todayTasks.find(t => t.type === type);
        if (existing && existing.blank) continue; // 已是空白餐卡
        // 删除旧任务（自动生成的或旧格式）
        if (existing) {
          await storage.delete('tasks', existing.id);
          const idx = todayTasks.indexOf(existing);
          if (idx >= 0) todayTasks.splice(idx, 1);
        }
        // 创建空白餐卡
        const task = {
          id: uuid(), date: today, module: 'babyfood', type,
          title: type === 'lunch' ? '午餐' : '晚餐',
          content: {
            mealType: type,
            dishes: [],
            nutritionSummary: { protein: false, vegetables: false, staple: false, fish: false, beans: false }
          },
          blank: true,
          manuallyEdited: true,
          completed: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
        };
        await storage.put('tasks', task);
        todayTasks.push(task);
      }
    };
    await ensureMealTasks();


    html += `<div class="toolbar" style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-yellow" onclick="babyfoodModule.regenerateToday()">重置今日食谱</button>
      <button class="btn" style="background:var(--ios-tertiary-bg);color:var(--ios-text);" onclick="babyfoodModule.showIngredientLibrary()">🥬 管理食材库</button>
    </div>`;

    const order = ['lunch','dinner'];
    const labels = {lunch:'午餐', dinner:'晚餐'};
    const icons = {lunch:'🍱', dinner:'🍲'};

    order.forEach(type => {
      const t = todayTasks.find(x=>x.type===type);
      if (!t) return;
      html += this.renderMealCard(t, labels[type], icons[type]);
    });

    // 历史任务
    const history = tasks.filter(t => t.date !== today);
    if (history.length) {
      html += `<div class="meal-title">📅 历史食谱</div>`;
      html += taskManager.renderDateGroups(history, t => {
        const c = t.content;
        return `<div class="task-item ${t.completed?'completed':''}" data-task-id="${t.id}">
          <div class="task-checkbox ${t.completed?'checked':''}" onclick="taskManager.toggleTaskComplete('${t.id}')">${t.completed?'✓':''}</div>
          <div class="task-content">
            <div class="task-title">${escapeHtml(t.title)}</div>
            <div class="task-meta">${c.dishes.map(d=>d.name).join('、')}</div>
          </div>
        </div>`;
      });
    }

    $('content').innerHTML = html;
  },

  renderMealCard(t, label, icon) {
    const c = t.content;
    const dishes = c.dishes || [];
    const ingCount = mealGenerator.countIngredients(dishes);
    const MAX_ING = 7;

    // 栏位定义：0=主食, 1=绿叶菜, 2=第三栏, 3=第四栏
    const slotLabels = ['🍚 主食', '🥬 绿叶菜', '🍽️ 第三栏', '🍽️ 第四栏'];
    const slotHints = ['选择主食', '先选绿叶菜，再选其他食材', '选择食材', '选择食材'];
    // 每个栏位允许的食材类型
    const slotTypes = ['staple', 'green', 'all', 'all'];

    // 把 dishes 分配到栏位（dishes 数组按栏位索引存储，null 为空栏位）
    const slots = [null, null, null, null];
    for (let i = 0; i < Math.min(dishes.length, 4); i++) {
      slots[i] = dishes[i];
    }

    const colors = {staple:'#FF9500', protein:'#FF3B30', fish:'#5856D6', vegetable:'#34C759', bean:'#007AFF', dairy:'#5AC8FA', fruit:'#FFCC00', soup:'#AF52DE'};

    // 概要行只显示有内容的菜品
    const validDishes = dishes.filter(d => d && d.name);
    let body = `<div class="meal-header">
      <div><div class="meal-name">${icon} ${label}</div>
      <div class="meal-type">${validDishes.length ? validDishes.map(d=>d.name).join(' · ') : '请选择食材'}</div></div>
      <div style="font-size:12px;color:${ingCount > MAX_ING ? 'var(--ios-red)' : 'var(--ios-text-secondary)'};white-space:nowrap;">${ingCount}/${MAX_ING}种</div>
    </div>
    <div class="meal-dishes">`;

    for (let s = 0; s < 4; s++) {
      const dish = slots[s];
      const dishIdx = dish ? dishes.indexOf(dish) : -1;
      if (dish) {
        // 已有菜品
        const ingTags = (dish.ingredients || [dish.name]).map(ing =>
          `<span style="display:inline-flex;align-items:center;background:var(--ios-secondary-bg);border-radius:8px;padding:2px 6px;font-size:11px;margin-right:4px;margin-top:2px;">${escapeHtml(ing)} <span style="margin-left:3px;color:var(--ios-text-secondary);cursor:pointer;font-size:13px;" onclick="event.stopPropagation();babyfoodModule.removeIngredient('${t.id}', ${dishIdx}, '${escapeHtml(ing)}')">✕</span></span>`
        ).join('');
        body += `<div class="dish-item">
          <div class="dish-dot" style="background:${colors[dish.category]||'#8E8E93'}"></div>
          <div class="dish-info" style="flex:1;">
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-size:10px;color:var(--ios-text-secondary);">${slotLabels[s]}</span>
              ${s > 0 ? `<span style="font-size:18px;color:var(--ios-primary);cursor:pointer;font-weight:700;padding:2px 6px;" onclick="babyfoodModule.showFoodPicker('${t.id}', ${s})">＋</span>` : ''}
            </div>
            <div class="dish-name">${escapeHtml(dish.name)}</div>
            <div style="margin-top:2px;">${ingTags}</div>
          </div>
        </div>`;
      } else {
        // 空栏位
        const canAdd = ingCount < MAX_ING;
        body += `<div class="dish-item" style="opacity:0.6;">
          <div class="dish-dot" style="background:var(--ios-separator);"></div>
          <div class="dish-info" style="flex:1;">
            <div style="font-size:10px;color:var(--ios-text-secondary);">${slotLabels[s]}</div>
            <div class="dish-name" style="color:var(--ios-text-secondary);font-size:13px;">${slotHints[s]}</div>
          </div>
          ${canAdd ? `<button class="btn" style="background:var(--ios-primary);color:#fff;font-size:12px;padding:4px 12px;min-width:auto;" onclick="babyfoodModule.showFoodPicker('${t.id}', ${s})">选择</button>` : ''}
        </div>`;
      }
    }

    body += `</div>`;
    if (ingCount > MAX_ING) {
      body += `<div style="margin-top:6px;font-size:12px;color:var(--ios-red);text-align:center;">⚠ 食材超过${MAX_ING}种上限（当前${ingCount}种）</div>`;
    }
    return `<div class="card meal-card"><div class="card-body no-padding">${body}</div></div>`;
  },

  async removeIngredient(taskId, dishIndex, ingredientName) {
    const tasks = await storage.getAll('tasks');
    const task = tasks.find(t => t.id === taskId);
    if (!task || !task.content?.dishes) return;
    const dish = task.content.dishes[dishIndex];
    if (!dish) return;
    if (dish.ingredients && dish.ingredients.length > 1) {
      dish.ingredients = dish.ingredients.filter(i => i !== ingredientName);
      if (dish.name.includes('炖汤')) {
        dish.name = dish.ingredients.join('') + '炖汤';
      } else {
        dish.name = dish.ingredients.join('');
      }
    } else {
      // 只剩1个食材，删除整道菜，用 null 占位保持栏位对齐
      task.content.dishes[dishIndex] = null;
    }
    task.content.manuallyEdited = true;
    task.content.nutritionSummary = this._calcNutrition(task.content.dishes);
    task.updatedAt = new Date().toISOString();
    await storage.put('tasks', task);
    this.render();
  },

  _calcNutrition(dishes) {
    const valid = dishes.filter(d => d);
    return {
      protein: valid.some(d => d.category === 'protein' || d.category === 'fish'),
      vegetables: valid.some(d => d.category === 'vegetable'),
      staple: valid.some(d => d.category === 'staple'),
      fish: valid.some(d => d.category === 'fish'),
      beans: valid.some(d => d.category === 'bean' || (d.ingredients || []).some(i => {
        const all = [...FOOD_DATA.beans, ...FOOD_DATA.legumes];
        return all.some(x => x.name === i);
      }))
    };
  },

  // 统一的食材选择弹窗，按栏位类型过滤
  async showFoodPicker(taskId, slot) {
    const allTasks = await storage.getAll('tasks');
    const task = allTasks.find(t => t.id === taskId);
    if (!task) return;
    const mealType = task.type;
    const today = todayStr();
    const month = new Date(today + 'T00:00:00').getMonth() + 1;
    const MAX_ING = 7;

    // 计算每个食材的最近食用日期
    const lastUsedMap = {};
    for (const t of allTasks) {
      if (t.module !== 'babyfood') continue;
      for (const d of (t.content?.dishes || [])) {
        if (!d) continue;
        for (const ing of (d.ingredients || [d.name])) {
          if (!lastUsedMap[ing] || t.date > lastUsedMap[ing]) lastUsedMap[ing] = t.date;
        }
      }
    }

    // 当前餐已用食材 + 跨餐去重（非肉类）
    const meatNames = FOOD_DATA.proteins.map(p => p.name);
    const otherMealTask = allTasks.find(t => t.date === task.date && t.module === 'babyfood' && t.type !== mealType);
    const otherMealIng = (otherMealTask?.content?.dishes || []).filter(d => d).flatMap(d => d.ingredients || [d.name]).filter(ing => !meatNames.includes(ing));
    const usedNames = (task.content?.dishes || []).filter(d => d).flatMap(d => d.ingredients || [d.name]).concat(otherMealIng);

    const ingCount = mealGenerator.countIngredients(task.content?.dishes || []);

    // 根据栏位决定可选食材列表
    let items = [];
    if (slot === 0) {
      // 主食
      items = FOOD_DATA.staples.map(s => ({...s, cat: 'staple', icon: '🍚'}));
    } else if (slot === 1) {
      // 第二栏：先选绿叶菜，再可选所有食材（不含主食）
      const hasGreen = (task.content?.dishes || []).some(d => d && d.category === 'vegetable' && (d.ingredients || []).some(i => FOOD_DATA.greens.some(g => g.name === i)));
      if (!hasGreen) {
        items = FOOD_DATA.greens.map(g => ({...g, cat: 'vegetable', icon: '🥬'}));
      } else {
        // 已有绿叶菜，显示所有食材（不含主食和绿叶菜——绿叶菜只在第二栏首次选择）
        items = [
          ...FOOD_DATA.proteins.map(p => ({...p, cat: p.category === 'fish' ? 'fish' : 'protein', icon: '🍖'})),
          ...FOOD_DATA.sides.map(s => ({...s, cat: 'vegetable', icon: s.sub === 'mushroom' || s.sub === 'fungus' ? '🍄' : '🥕'})),
          ...FOOD_DATA.beans.map(b => ({...b, cat: 'bean', icon: '🫘'})),
          ...FOOD_DATA.legumes.map(l => ({...l, cat: 'bean', icon: '🌱'}))
        ];
      }
    } else {
      // 第三、四栏：所有食材（不含主食和绿叶菜——绿叶菜只在第二栏）
      items = [
        ...FOOD_DATA.proteins.map(p => ({...p, cat: p.category === 'fish' ? 'fish' : 'protein', icon: '🍖'})),
        ...FOOD_DATA.sides.map(s => ({...s, cat: 'vegetable', icon: s.sub === 'mushroom' || s.sub === 'fungus' ? '🍄' : '🥕'})),
        ...FOOD_DATA.beans.map(b => ({...b, cat: 'bean', icon: '🫘'})),
        ...FOOD_DATA.legumes.map(l => ({...l, cat: 'bean', icon: '🌱'}))
      ];
    }

    // 过滤已用食材
    let available = items.filter(item => !usedNames.includes(item.name));

    // 按上次食用日期升序排序（未吃的=0排最前，最久未吃的在前）
    available.sort((a, b) => {
      const da = lastUsedMap[a.name] ? new Date(lastUsedMap[a.name]).getTime() : 0;
      const db = lastUsedMap[b.name] ? new Date(lastUsedMap[b.name]).getTime() : 0;
      return da - db;
    });

    // 分组显示
    const groups = {};
    for (const item of available) {
      let g;
      if (item.cat === 'staple') g = '🍚 主食';
      else if (item.cat === 'protein') g = '🍖 肉类';
      else if (item.cat === 'fish') g = '🐟 鱼虾';
      else if (item.cat === 'bean') g = '🫘 豆类';
      else if (item.sub === 'mushroom' || item.sub === 'fungus') g = '🍄 菌菇';
      else if (FOOD_DATA.greens.some(g2 => g2.name === item.name)) g = '🥬 绿叶菜';
      else g = '🥕 配菜';
      if (!groups[g]) groups[g] = [];
      groups[g].push(item);
    }
    // 保持固定顺序
    const groupOrder = ['🍚 主食', '🥬 绿叶菜', '🍖 肉类', '🐟 鱼虾', '🥕 配菜', '🍄 菌菇', '🫘 豆类'];

    const fmtDate = (d) => {
      if (!d) return '未吃';
      const diff = Math.floor((new Date(today) - new Date(d)) / 86400000);
      if (diff === 0) return '今天';
      if (diff === 1) return '昨天';
      if (diff < 7) return diff + '天前';
      if (diff < 30) return Math.floor(diff / 7) + '周前';
      return d.slice(5).replace('-', '/');
    };

    const slotNames = ['主食', '绿叶菜', '第三栏', '第四栏'];
    const hint = slot === 1 && !(task.content?.dishes || []).some(d => d && d.category === 'vegetable' && (d.ingredients || []).some(i => FOOD_DATA.greens.some(g => g.name === i)))
      ? '请先选择绿叶菜' : '点击添加食材（久未吃的靠前）';

    let body = `
      <input class="form-input" id="food-search" placeholder="搜索食材..." oninput="babyfoodModule._filterFoodSearch()" style="margin-bottom:8px;">
      <div style="font-size:11px;color:var(--ios-text-secondary);margin-bottom:8px;display:flex;justify-content:space-between;">
        <span>${hint}</span>
        <span>当前 ${ingCount}/${MAX_ING} 种</span>
      </div>
      <div id="food-list" style="max-height:55vh;overflow-y:auto;">`;

    for (const gName of groupOrder) {
      const gItems = groups[gName];
      if (!gItems || !gItems.length) continue;
      body += `<div style="font-weight:700;font-size:13px;padding:6px 12px;background:var(--ios-tertiary-bg);position:sticky;top:0;">${gName}（${gItems.length}）</div>`;
      for (const item of gItems) {
        const lastDate = lastUsedMap[item.name];
        const dateLabel = fmtDate(lastDate);
        const inSeason = mealGenerator.isInSeason(item, month);
        const seasonStyle = inSeason ? '' : 'opacity:0.4;';
        const seasonTag = inSeason ? '' : '<span style="font-size:9px;background:var(--ios-secondary-bg);padding:1px 4px;border-radius:4px;margin-left:4px;">非当季</span>';
        const dateColor = !lastDate ? 'var(--ios-green)' : 'var(--ios-text-secondary)';
        const disabled = ingCount >= MAX_ING ? 'pointer-events:none;opacity:0.3;' : '';
        body += `<div class="food-pick-item" data-name="${escapeHtml(item.name)}" style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ios-separator-light);cursor:pointer;${seasonStyle}${disabled}" onclick="babyfoodModule._pickFood('${taskId}', ${slot}, '${escapeHtml(item.name)}', '${item.cat}')">
          <span style="font-size:18px;">${item.icon || '🥕'}</span>
          <span style="flex:1;font-weight:600;">${escapeHtml(item.name)}${seasonTag}</span>
          <span style="font-size:11px;color:${dateColor};white-space:nowrap;">${dateLabel}</span>
        </div>`;
      }
    }

    if (!available.length) {
      body += '<div style="padding:20px;text-align:center;color:var(--ios-text-secondary);">没有可选的食材了</div>';
    }
    body += `</div>`;
    app.showModal('选择' + slotNames[slot] + ' - ' + (mealType === 'lunch' ? '午餐' : '晚餐'), body);
  },

  _filterFoodSearch() {
    const q = ($('food-search')?.value || '').toLowerCase();
    document.querySelectorAll('.food-pick-item').forEach(el => {
      const name = el.dataset.name || '';
      el.style.display = name.toLowerCase().includes(q) ? 'flex' : 'none';
    });
  },

  async _pickFood(taskId, slot, ingredientName, cat) {
    app.hideModal();
    const tasks = await storage.getAll('tasks');
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    const dishes = task.content.dishes || [];
    const MAX_ING = 7;

    if (mealGenerator.countIngredients(dishes) >= MAX_ING) {
      showToast('食材已达' + MAX_ING + '种上限');
      return;
    }

    if (slot === 0) {
      // 主食：替换或新建（slot 0 固定为主食位）
      const stapleData = FOOD_DATA.staples.find(s => s.name === ingredientName || (s.ingredients || []).includes(ingredientName));
      const stapleName = stapleData ? mealGenerator.getStapleName(stapleData) : ingredientName;
      const stapleIng = stapleData ? (stapleData.ingredients || [stapleData.name]) : [ingredientName];
      dishes[0] = { name: stapleName, category: 'staple', ingredients: stapleIng, note: '' };
    } else {
      // slot 1/2/3 对应 dishes[slot]，dishes 数组用 null 保持栏位对齐
      // 检查相克
      for (const d of dishes) {
        if (!d) continue;
        const incompatible = FOOD_DATA.incompatible[ingredientName] || [];
        if ((d.ingredients || []).some(i => incompatible.includes(i))) {
          if (!confirm(`${ingredientName}与${d.name}中的食材不宜同食，仍要添加吗？`)) return;
          break;
        }
      }
      const existingDish = dishes[slot];
      if (existingDish) {
        // 当前栏位已有菜品：把食材加到这个菜品
        if (!existingDish.ingredients) existingDish.ingredients = [existingDish.name];
        if (!existingDish.ingredients.includes(ingredientName)) {
          existingDish.ingredients.push(ingredientName);
          // 更新菜名：直接用食材名拼接，不加烹饪前缀
          if (existingDish.name.includes('炖汤')) {
            existingDish.name = existingDish.ingredients.join('') + '炖汤';
          } else {
            existingDish.name = existingDish.ingredients.join('');
          }
        }
      } else {
        // 当前栏位没有菜品：新建菜品放到 slot 位置（用 null 占位保持对齐）
        const dishName = cat === 'bean' ? ingredientName + '炖汤' : ingredientName;
        while (dishes.length < slot) dishes.push(null);
        dishes[slot] = { name: dishName, category: cat, ingredients: [ingredientName], note: '手动选择' };
      }
    }

    task.content.dishes = dishes;
    task.content.manuallyEdited = true;
    task.content.nutritionSummary = this._calcNutrition(task.content.dishes);
    task.updatedAt = new Date().toISOString();
    await storage.put('tasks', task);
    showToast('已添加：' + ingredientName);
    this.render();
  },

  async regenerateToday() {
    const today = todayStr();
    const tasks = await taskManager.getTasksByModule('babyfood');
    // 删除今天的旧食谱
    for (const t of tasks.filter(x => x.date === today)) {
      await storage.delete('tasks', t.id);
    }
    // 创建空白餐卡，用户手动选择
    for (const type of ['lunch', 'dinner']) {
      await storage.put('tasks', {
        id: uuid(), date: today, module: 'babyfood', type,
        title: type === 'lunch' ? '午餐' : '晚餐',
        content: {
          mealType: type,
          dishes: [],
          nutritionSummary: { protein: false, vegetables: false, staple: false, fish: false, beans: false }
        },
        manuallyEdited: true,
        blank: true,
        completed: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
      });
    }
    showToast('已重置今日食谱');
    this.render();
  },

  async showIngredientLibrary() {
    app.setTitle('宝宝食材库');
    const custom = await storage.getAll('custom_food_ingredients').catch(() => []) || [];
    const allTasks = await taskManager.getTasksByModule('babyfood');
    // 计算每个食材最近食用日期
    const lastUsedMap = {};
    for (const t of allTasks) {
      const dishes = t.content?.dishes || (t.content?.lunch?.dishes ? [...t.content.lunch.dishes, ...t.content.dinner.dishes] : []);
      for (const d of dishes) {
        if (!d) continue;
        for (const ing of (d.ingredients || [d.name])) {
          if (!lastUsedMap[ing] || t.date > lastUsedMap[ing]) lastUsedMap[ing] = t.date;
        }
      }
    }
    const today = todayStr();
    const fmtDate = (d) => {
      if (!d) return '';
      const diff = Math.floor((new Date(today) - new Date(d)) / 86400000);
      if (diff === 0) return '今天';
      if (diff === 1) return '昨天';
      if (diff < 7) return diff + '天前';
      if (diff < 30) return Math.floor(diff/7) + '周前';
      return d.slice(5).replace('-', '/');
    };
    const categories = [
      {key:'staples', label:'🍚 主食', data:FOOD_DATA.staples},
      {key:'proteins', label:'🍖 肉蛋鱼虾', data:FOOD_DATA.proteins},
      {key:'greens', label:'🥬 绿叶菜', data:FOOD_DATA.greens},
      {key:'sides', label:'🥕 配菜', data:FOOD_DATA.sides.filter(s => s.sub !== 'mushroom' && s.sub !== 'fungus')},
      {key:'mushrooms', label:'🍄 菌菇', data:FOOD_DATA.sides.filter(s => s.sub === 'mushroom' || s.sub === 'fungus')},
      {key:'beans', label:'🫘 豆制品', data:FOOD_DATA.beans},
      {key:'legumes', label:'🌱 豆类', data:FOOD_DATA.legumes}
    ];
    let html = `<div class="toolbar">
      <button class="btn" style="background:var(--ios-tertiary-bg);color:var(--ios-text);" onclick="babyfoodModule.render()">← 返回今日食谱</button>
    </div>`;
    html += `<div class="card"><div class="card-body">
      <p style="font-size:13px;color:var(--ios-text-secondary);margin:0 0 12px 0;">
        食材库来自辅食日历照片。绿色=宝宝喜爱/常见。标注最近食用时间。点击食材可复制名称。
      </p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">`;
    for (const cat of categories) {
      html += `<div style="width:100%;margin-top:8px;font-weight:700;font-size:14px;">${cat.label}</div>`;
      for (const item of cat.data) {
        const tagStyle = item.common ? 'background:#E8F5E9;color:#2E7D32;' : 'background:var(--ios-secondary-bg);color:var(--ios-text);';
        const lastDate = lastUsedMap[item.name];
        const dateLabel = lastDate ? `<span style="font-size:10px;opacity:0.7;margin-left:4px;">${fmtDate(lastDate)}</span>` : '<span style="font-size:10px;opacity:0.4;margin-left:4px;">未吃</span>';
        html += `<span class="tag" style="${tagStyle}padding:6px 10px;border-radius:12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;" onclick="babyfoodModule.copyIngredientName('${escapeHtml(item.name)}')">${escapeHtml(item.name)}${dateLabel} <span style="margin-left:4px;color:var(--ios-text-secondary);font-size:12px;" onclick="event.stopPropagation();babyfoodModule.deleteBuiltinIngredient('${escapeHtml(item.name)}','${cat.key}')">✕</span></span>`;
      }
    }
    html += `</div></div></div>`;

    // 自定义食材区域
    html += `<div class="card" style="margin-top:16px;"><div class="card-header">➕ 添加自定义食材</div><div class="card-body">
      <div class="form-group">
        <label class="form-label">食材名称</label>
        <input class="form-input" id="custom-ing-name" type="text" placeholder="如：菱角">
      </div>
      <div class="form-group">
        <label class="form-label">分类</label>
        <select class="form-input" id="custom-ing-cat">
          <option value="sides">配菜</option>
          <option value="mushrooms">菌菇</option>
          <option value="greens">绿叶菜</option>
          <option value="proteins">肉蛋鱼虾</option>
          <option value="beans">豆制品</option>
          <option value="legumes">豆类</option>
          <option value="staples">主食</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">纤维/消化难度</label>
        <select class="form-input" id="custom-ing-fiber">
          <option value="low">低纤维易消化</option>
          <option value="mid">中等</option>
          <option value="high">高纤维难消化</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">季节（可选，月份范围如 6-9）</label>
        <input class="form-input" id="custom-ing-season" type="text" placeholder="留空表示全年">
      </div>
      <button class="btn btn-primary" onclick="babyfoodModule.addCustomIngredient()">添加到食材库</button>
    </div></div>`;

    // 已添加自定义食材
    const customAdded = custom.filter(c => !c.deleted);
    if (customAdded.length) {
      html += `<div class="card" style="margin-top:16px;"><div class="card-header">📝 已添加食材</div><div class="card-body"><div style="display:flex;flex-wrap:wrap;gap:6px;">`;
      for (const item of customAdded) {
        html += `<span class="tag" style="background:var(--ios-secondary-bg);color:var(--ios-text);padding:6px 10px;border-radius:12px;font-size:13px;">${escapeHtml(item.name)} <span style="color:var(--ios-primary);cursor:pointer;" onclick="babyfoodModule.removeCustomIngredient('${escapeHtml(item.name)}')">✕</span></span>`;
      }
      html += `</div></div></div>`;
    }

    // 已移除的内置食材（可恢复）
    const deleted = custom.filter(c => c.deleted);
    if (deleted.length) {
      html += `<div class="card" style="margin-top:16px;"><div class="card-header">🗑️ 已移除食材（点击恢复）</div><div class="card-body"><div style="display:flex;flex-wrap:wrap;gap:6px;">`;
      for (const item of deleted) {
        html += `<span class="tag" style="background:var(--ios-secondary-bg);color:var(--ios-text-secondary);padding:6px 10px;border-radius:12px;font-size:13px;text-decoration:line-through;cursor:pointer;" onclick="babyfoodModule.restoreBuiltinIngredient('${escapeHtml(item.name)}')">${escapeHtml(item.name)} ↩</span>`;
      }
      html += `</div></div></div>`;
    }

    $('content').innerHTML = html;
  },

  copyIngredientName(name) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(name).then(() => showToast('已复制：' + name));
    } else {
      showToast(name);
    }
  },

  async addCustomIngredient() {
    const name = $('custom-ing-name').value.trim();
    const cat = $('custom-ing-cat').value;
    const fiber = $('custom-ing-fiber').value;
    const seasonStr = $('custom-ing-season').value.trim();
    if (!name) return showToast('请输入食材名称');
    let season = [];
    if (seasonStr) {
      const m = seasonStr.match(/(\d+)\s*-\s*(\d+)/);
      if (m) season = [parseInt(m[1]), parseInt(m[2])];
    }
    const custom = await storage.getAll('custom_food_ingredients').catch(() => []) || [];
    if (custom.some(c => c.name === name)) return showToast('该食材已存在');
    const id = 'ci_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await storage.put('custom_food_ingredients', {id, name, category:cat, fiber, season, flavor:'mild'});
    // 合并到 FOOD_DATA
    await this.mergeCustomIngredients();
    showToast('已添加');
    this.showIngredientLibrary();
  },

  async removeCustomIngredient(name) {
    const custom = await storage.getAll('custom_food_ingredients').catch(() => []) || [];
    const item = custom.find(c => c.name === name && !c.deleted);
    if (item) await storage.delete('custom_food_ingredients', item.id);
    await this.mergeCustomIngredients();
    showToast('已删除');
    this.showIngredientLibrary();
  },

  async deleteBuiltinIngredient(name, category) {
    await storage.put('custom_food_ingredients', { id: 'del_' + name, name, deleted: true, category });
    await this.mergeCustomIngredients();
    showToast('已移除：' + name);
    this.showIngredientLibrary();
  },

  async restoreBuiltinIngredient(name) {
    const all = await storage.getAll('custom_food_ingredients').catch(() => []) || [];
    const item = all.find(c => c.id === 'del_' + name);
    if (item) await storage.delete('custom_food_ingredients', item.id);
    await this.mergeCustomIngredients();
    showToast('已恢复：' + name);
    this.showIngredientLibrary();
  },

  async mergeCustomIngredients() {
    // 将自定义食材合并到 FOOD_DATA，并过滤被删除的内置食材（页面刷新后需要重新调用）
    try {
      const custom = await storage.getAll('custom_food_ingredients');
      if (!custom) return;
      // 先从原始数据恢复（防止多次调用累积删除）
      for (const cat of ['staples','proteins','greens','sides','beans','legumes']) {
        FOOD_DATA[cat] = JSON.parse(JSON.stringify(FOOD_DATA_ORIGINAL[cat]));
      }
      // 过滤被删除的内置食材
      const deletedNames = custom.filter(c => c.deleted).map(c => c.name);
      for (const cat of ['staples','proteins','greens','sides','beans','legumes']) {
        FOOD_DATA[cat] = FOOD_DATA[cat].filter(item => !deletedNames.includes(item.name));
      }
      // 合并自定义食材
      for (const c of custom) {
        if (c.deleted) continue;
        // mushrooms 类型的自定义食材合并到 sides，sub 设为 mushroom
        const cat = c.category === 'mushrooms' ? 'sides' : c.category;
        const list = FOOD_DATA[cat];
        if (!list) continue;
        if (list.some(x => x.name === c.name)) continue;
        const sub = c.category === 'mushrooms' ? 'mushroom' : 'custom';
        list.push({name:c.name, sub, fiber:c.fiber || 'low', season:c.season || [], flavor:c.flavor || 'mild'});
      }
    } catch(e) {} // 存储不存在时静默忽略
  }
};

  autoSaveDebounce: debounce((taskId) => taskManager.saveTaskInput(taskId), 300),

  async addTask(moduleId) {
    const t = {
      id: uuid(), date: todayStr(), module: moduleId, type: 'custom',
      title: '新任务', content: {text:''},

    };

/* ================= AQI 空气质量模块 ================= */

const aqiModule = {
  _timer: null,
  _cache: null,
  _cacheTime: 0,
  // 固定坐标：海宁优先，嘉兴备选
  LOCATIONS: [
    { name: '海宁', lat: 30.7569, lng: 120.6923 },
    { name: '嘉兴', lat: 30.7520, lng: 120.7600 }
  ],

  // AQI 等级（美标）
  getLevel(aqi) {
    if (aqi <= 50) return { label: '优', color: '#00e400', bg: 'rgba(0,228,0,0.1)' };
    if (aqi <= 100) return { label: '良', color: '#ffff00', bg: 'rgba(255,255,0,0.12)' };
    if (aqi <= 150) return { label: '轻度污染', color: '#ff7e00', bg: 'rgba(255,126,0,0.12)' };
    if (aqi <= 200) return { label: '中度污染', color: '#ff0000', bg: 'rgba(255,0,0,0.12)' };
    if (aqi <= 300) return { label: '重度污染', color: '#8f3f97', bg: 'rgba(143,63,151,0.15)' };
    return { label: '严重污染', color: '#7e0023', bg: 'rgba(126,0,35,0.2)' };
  },

  getPollutantName(key) {
    const map = { pm25: 'PM2.5', pm10: 'PM10', o3: 'O3', no2: 'NO2', so2: 'SO2', co: 'CO' };
    return map[key] || key;
  },

  async init() {
    this.fetch();
    if (this._timer) clearInterval(this._timer);
    this._timer = setInterval(() => this.fetch(), 5 * 60 * 1000);
  },

  async fetch() {
    const bar = $('aqi-bar');
    if (!bar) return;

    const now = Date.now();
    if (this._cache && now - this._cacheTime < 60000) {
      this.render(this._cache);
      return;
    }

    bar.innerHTML = this.getBabyAgeCardHtml() + (typeof goldModule !== 'undefined' ? goldModule.getGoldCardHtml() : '');

    const results = [];

    // 尝试海宁→嘉兴
    for (const loc of this.LOCATIONS) {
      // 数据源1: 在意空气 aqicn.org（美标AQI）
      try {
        const url1 = `https://api.waqi.info/feed/geo:${loc.lat.toFixed(4)};${loc.lng.toFixed(4)}/?token=demo`;
        const res1 = await fetch(url1);
        const json1 = await res1.json();
        if (json1.status === 'ok' && json1.data) {
          const d = json1.data;
          const aqi = d.aqi;
          const level = this.getLevel(aqi);
          let mainPol = '';
          if (d.iaqi) {
            let maxVal = 0, maxKey = '';
            for (const [k, v] of Object.entries(d.iaqi)) {
              if (v && v.v > maxVal) { maxVal = v.v; maxKey = k; }
            }
            mainPol = maxKey ? this.getPollutantName(maxKey) : '';
          }
          results.push({
            source: '在意空气',
            aqi, level, mainPol,
            time: d.time && d.time.s ? d.time.s : '',
            city: (d.city && d.city.name) ? `${loc.name}（${d.city.name}）` : loc.name
          });

          // 数据源2: 中国国控站（aqicn 数据中包含中国环境监测站来源时单独展示）
          const hasChinaGov = d.attributions && d.attributions.some(a =>
            a.name && (a.name.includes('环境监测') || a.name.includes('real-time publishing'))
          );
          if (hasChinaGov) {
            results.push({
              source: '中国国控站',
              aqi, level, mainPol,
              time: d.time && d.time.s ? d.time.s : '',
              city: (d.city && d.city.name) ? `${loc.name}（${d.city.name}）` : loc.name
            });
          }
          break; // 海宁有数据就不再用嘉兴
        }
      } catch(e) { console.warn('AQI aqicn fetch failed', e); }
    }

    // 数据源3: IQAir 智空气（美标AQI，需要API Key）
    const iqairKey = localStorage.getItem('iqair_api_key') || '';
    const iqairLoc = this.LOCATIONS[0]; // 海宁
    if (iqairKey) {
      try {
        const url2 = `https://api.airvisual.com/v2/nearest_city?lat=${iqairLoc.lat.toFixed(4)}&lon=${iqairLoc.lng.toFixed(4)}&key=${iqairKey}`;
        const res2 = await fetch(url2);
        const json2 = await res2.json();
        if (json2.status === 'success' && json2.data) {
          const d = json2.data;
          const aqi = d.current && d.current.pollution ? d.current.pollution.aqus : null;
          if (aqi !== null) {
            const level = this.getLevel(aqi);
            let mainPol = '';
            if (d.current.pollution.mainus) {
              const polMap = { p1: 'PM10', p2: 'PM2.5', o3: 'O3', n2: 'NO2', s2: 'SO2', co: 'CO' };
              mainPol = polMap[d.current.pollution.mainus] || d.current.pollution.mainus;
            }
            results.push({
              source: 'IQAir智空气',
              aqi, level, mainPol,
              time: d.current.pollution.ts ? d.current.pollution.ts.replace('T', ' ').replace('.000Z', '') : '',
              city: d.city ? d.city : iqairLoc.name
            });
          }
        }
      } catch(e) { console.warn('AQI IQAir fetch failed', e); }
    } else {
      // 未配置 Key 时显示提示卡片
      results.push({
        source: 'IQAir智空气',
        aqi: '—', level: { label: '未配置', color: 'var(--ios-text-secondary)', bg: 'rgba(142,142,147,0.08)' },
        mainPol: '设置中填入Key',
        time: '',
        city: ''
      });
    }

    if (results.length) {
      this._cache = results;
      this._cacheTime = now;
      this.render(results);
    } else {
      bar.innerHTML = this.getBabyAgeCardHtml() + (typeof goldModule !== 'undefined' ? goldModule.getGoldCardHtml() : '');
    }
  },

  // 计算宝宝月龄（生日 2024.2.28）
  BABY_BIRTH: { year: 2024, month: 2, day: 28 },
  getBabyAge() {
    const b = this.BABY_BIRTH;
    const now = new Date();
    let years = now.getFullYear() - b.year;
    let months = now.getMonth() + 1 - b.month;
    let days = now.getDate() - b.day;
    if (days < 0) {
      months -= 1;
      // 上个月的天数
      const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
      days += prevMonth;
    }
    if (months < 0) {
      years -= 1;
      months += 12;
    }
    const totalMonths = years * 12 + months;
    let label = '';
    if (years > 0) {
      label = `${years}岁${months}个月`;
    } else {
      label = `${months}个月${days}天`;
    }
    return { years, months, days, totalMonths, label };
  },

  getBabyAgeCardHtml() {
    const age = this.getBabyAge();
    return `<div class="aqi-card" style="background:rgba(255,204,0,0.12);">
      <div class="aqi-card-source">👶 宝宝月龄</div>
      <div class="aqi-card-value-row">
        <div class="aqi-card-value" style="color:#FF9500;font-size:18px;">${age.totalMonths}月</div>
        <div class="aqi-card-level" style="color:#FF9500;">${age.label}</div>
      </div>
      <div class="aqi-card-pollutant">生日 2024.2.28</div>
    </div>`;
  },

  render(results) {
    const bar = $('aqi-bar');
    if (!bar) return;
    let html = this.getBabyAgeCardHtml(); // 月龄卡片始终显示
    // 金价卡片（在月龄之后）
    if (typeof goldModule !== 'undefined') {
      html += goldModule.getGoldCardHtml();
    }
    for (const r of results) {
      // IQAir 未配置的不显示
      if (typeof r.aqi !== 'number') continue;
      // 仅 AQI > 70 时才显示 AQI 卡片
      if (r.aqi <= 70) continue;
      const aqiText = r.aqi;
      html += `<div class="aqi-card" style="background:${r.level.bg};">
        <div class="aqi-card-source">${escapeHtml(r.source)}</div>
        <div class="aqi-card-value-row">
          <div class="aqi-card-value" style="color:${r.level.color};">${aqiText}</div>
          <div class="aqi-card-level" style="color:${r.level.color};">${r.level.label}</div>
        </div>
        ${r.mainPol ? `<div class="aqi-card-pollutant">首要: ${escapeHtml(r.mainPol)}</div>` : ''}
        ${r.city ? `<div class="aqi-card-pollutant">${escapeHtml(r.city)}</div>` : ''}
        ${r.time ? `<div class="aqi-card-time">${escapeHtml(r.time)}</div>` : ''}
      </div>`;
    }
    bar.innerHTML = html;
  }
};

const pictureBookModule = {
  _bookIndices: undefined,
  _bookDate: '',
  // TTS 播放状态
  _playQueue: [],     // 播放队列（PICTURE_BOOKS 索引数组）
  _playIndex: 0,      // 当前播放到的绘本索引
  _sentIndex: 0,      // 当前绘本的句子索引
  _isLoop: true,
  _isPlaying: false,
  _isPaused: false,

  async render() {
    app.setTitle('英语绘本');
    const today = todayStr();

    if (this._bookIndices === undefined || this._bookDate !== today) {
      this._bookIndices = this.pickBooksForDay(today);
      this._bookDate = today;
    }

    let html = `<div class="toolbar" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <button class="btn btn-yellow" onclick="pictureBookModule.playAll()">▶ 一键播放（循环）</button>
      <button class="btn" style="background:var(--ios-tertiary-bg);color:var(--ios-text);" onclick="pictureBookModule.shuffle()">🔀 换一批</button>
    </div>`;

    // 内嵌播放控制条
    if (this._playQueue.length > 0 && this._playIndex < this._playQueue.length) {
      const bookIdx = this._playQueue[this._playIndex];
      const book = PICTURE_BOOKS[bookIdx];
      const num = this._playIndex + 1;
      const total = this._playQueue.length;
      const sentNum = this._sentIndex + 1;
      const sentTotal = book.story.length;
      const playIcon = this._isPaused ? '▶' : '⏸';
      html += `<div class="card" style="border:2px solid var(--ios-primary);margin:10px 16px;">
        <div class="card-body" style="display:flex;align-items:center;gap:8px;">
          <button class="btn btn-secondary" style="min-width:44px;height:44px;border-radius:50%;padding:0;" onclick="pictureBookModule._prev()">⏮</button>
          <button class="btn btn-primary" style="min-width:50px;height:50px;border-radius:50%;padding:0;font-size:20px;" onclick="pictureBookModule.togglePlay()">${playIcon}</button>
          <button class="btn btn-secondary" style="min-width:44px;height:44px;border-radius:50%;padding:0;" onclick="pictureBookModule._next()">⏭</button>
          <div style="flex:1;min-width:0;">
            <div style="font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(book.title)}</div>
            <div style="font-size:12px;color:var(--ios-text-secondary);">第${num}/${total}本 · 句${sentNum}/${sentTotal} · ${this._isPaused ? '已暂停' : '朗读中'} 🔁</div>
          </div>
          <button class="btn btn-ghost" style="font-size:18px;padding:8px;" onclick="pictureBookModule.stop()">✕</button>
        </div>
      </div>`;
    }

    this._bookIndices.forEach((idx, i) => {
      const book = PICTURE_BOOKS[idx];
      const num = i + 1;
      const isCurrent = this._playQueue.length > 0 && this._playIndex === i;
      // 构建完整故事HTML
      let storyHtml = '';
      book.story.forEach((s, si) => {
        const sentIsCurrent = isCurrent && this._sentIndex === si;
        storyHtml += `<div style="margin-bottom:8px;padding:8px 10px;background:${sentIsCurrent ? 'rgba(229,57,53,0.12)' : 'rgba(229,57,53,0.04)'};border-radius:10px;border-left:3px solid ${sentIsCurrent ? 'var(--ios-primary)' : 'rgba(229,57,53,0.2)'};${sentIsCurrent ? 'box-shadow:0 2px 8px rgba(229,57,53,0.15);' : ''}">
          <div style="font-size:15px;font-weight:600;margin-bottom:2px;color:var(--ios-text);">${escapeHtml(s.en)}</div>
          <div style="font-size:13px;color:var(--ios-text-secondary);">${escapeHtml(s.zh)}</div>
        </div>`;
      });
      html += `<div class="card" style="${isCurrent ? 'border:2px solid var(--ios-primary);' : 'border-left:4px solid var(--ios-primary);'}">
        <div class="card-header">
          <span style="font-size:20px;">📕</span>
          <span style="margin-left:6px;">第${num}本 · ${escapeHtml(book.topic)} · ${escapeHtml(book.age)}</span>
          ${isCurrent ? '<span style="font-size:12px;color:var(--ios-primary);font-weight:700;">▶ 朗读中</span>' : ''}
        </div>
        <div class="card-body">
          <div style="font-size:18px;font-weight:700;margin-bottom:4px;">${escapeHtml(book.title)}</div>
          <div style="color:var(--ios-text-secondary);font-size:14px;margin-bottom:4px;">${escapeHtml(book.zh)}</div>
          <div style="font-size:12px;color:var(--ios-text-secondary);margin-bottom:8px;">✍️ ${escapeHtml(book.author)}</div>
          <div style="font-size:13px;color:var(--ios-text);margin-bottom:10px;line-height:1.5;">${escapeHtml(book.intro)}</div>
          <div style="font-size:11px;color:var(--ios-text-secondary);margin-bottom:6px;font-weight:600;">📖 完整故事（中英对照）</div>
          ${storyHtml}
          <div style="font-size:13px;color:var(--ios-text-secondary);margin-top:10px;margin-bottom:10px;">💡 ${escapeHtml(book.tip)}</div>
          <button class="btn btn-primary" style="font-size:13px;padding:8px 16px;" onclick="pictureBookModule.playOne(${i})">📖 朗读英文</button>
        </div>
      </div>`;
    });

    $('content').innerHTML = html;
  },

  pickBooksForDay(dateStr) {
    const rng = new SeededRandom(dateStr + '-picturebook');
    const pool = [];
    for (let i = 0; i < PICTURE_BOOKS.length; i++) pool.push(i);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(rng.next() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, 3);
  },

  shuffle() {
    const pool = [];
    for (let i = 0; i < PICTURE_BOOKS.length; i++) pool.push(i);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    this._bookIndices = pool.slice(0, 3);
    this.stop();
    this.render();
  },

  showDetail(queueIdx) {
    const bookIdx = this._bookIndices[queueIdx];
    const book = PICTURE_BOOKS[bookIdx];
    let body = `<div style="font-size:13px;color:var(--ios-text-secondary);margin-bottom:12px;">✍️ ${escapeHtml(book.author)} · ${escapeHtml(book.age)} · ${escapeHtml(book.topic)}</div>`;
    body += `<div style="font-size:14px;color:var(--ios-text);margin-bottom:16px;line-height:1.5;">${escapeHtml(book.intro)}</div>`;
    book.story.forEach((s, i) => {
      body += `<div style="margin-bottom:12px;padding:10px;background:rgba(229,57,53,0.05);border-radius:12px;border-left:3px solid var(--ios-primary);">
        <div style="font-size:15px;font-weight:600;margin-bottom:4px;">${escapeHtml(s.en)}</div>
        <div style="font-size:13px;color:var(--ios-text-secondary);">${escapeHtml(s.zh)}</div>
      </div>`;
    });
    body += `<div style="font-size:13px;color:var(--ios-text-secondary);margin-top:12px;">💡 ${escapeHtml(book.tip)}</div>`;
    app.showModal(book.title + ' · ' + book.zh, body, `
      <button class="btn btn-secondary" onclick="app.hideModal()">关闭</button>
      <button class="btn btn-primary" onclick="app.hideModal();pictureBookModule.playOne(${queueIdx})">▶ 朗读���文</button>
    `);
  },

  // ===== TTS 英文朗读控制 =====

  playAll() {
    if (!('speechSynthesis' in window)) {
      showToast('当前设备不支持语音朗读');
      return;
    }
    this._playQueue = [...this._bookIndices];
    this._playIndex = 0;
    this._sentIndex = 0;
    this._isLoop = true;
    this._isPaused = false;
    this._isPlaying = true;
    this._speakCurrent();
  },

  playOne(queueIdx) {
    if (!('speechSynthesis' in window)) {
      showToast('当前设备不支持语音朗读');
      return;
    }
    this._playQueue = [...this._bookIndices];
    this._playIndex = queueIdx;
    this._sentIndex = 0;
    this._isLoop = true;
    this._isPaused = false;
    this._isPlaying = true;
    this._speakCurrent();
  },

  _speakCurrent() {
    if (!this._isPlaying || this._isPaused) return;
    if (this._playIndex >= this._playQueue.length) {
      if (this._isLoop) { this._playIndex = 0; this._sentIndex = 0; }
      else { this._isPlaying = false; this.render(); return; }
    }
    const bookIdx = this._playQueue[this._playIndex];
    const book = PICTURE_BOOKS[bookIdx];
    if (this._sentIndex >= book.story.length) {
      // 当前绘本读完，下一本
      this._playIndex++;
      this._sentIndex = 0;
      setTimeout(() => this._speakCurrent(), 500);
      return;
    }

    const sentence = book.story[this._sentIndex].en;
    speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(sentence);
    u.lang = 'en-US';
    u.rate = 1.0;
    u.pitch = 1.1;
    const voices = speechSynthesis.getVoices();
    // 优先选择甜美女声
    const femaleNames = ['Samantha','Google US English','Microsoft Zira','Microsoft Aria','Karen','Moira','Tessa','Google 普通话（中国大陆）','Female'];
    let enVoice = null;
    for (const name of femaleNames) {
      enVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes(name));
      if (enVoice) break;
    }
    if (!enVoice) {
      // 优先选带 Female 标识或常见女声
      enVoice = voices.find(v => v.lang.startsWith('en') && /female|woman|girl|samantha|karen|moira|tessa|aria|zira/i.test(v.name))
        || voices.find(v => v.lang.startsWith('en'));
    }
    if (enVoice) u.voice = enVoice;

    u.onend = () => {
      if (!this._isPlaying || this._isPaused) return;
      this._sentIndex++;
      setTimeout(() => this._speakCurrent(), 400);
    };
    u.onerror = () => {
      if (!this._isPlaying || this._isPaused) return;
      this._sentIndex++;
      setTimeout(() => this._speakCurrent(), 400);
    };

    this.render();
    speechSynthesis.speak(u);
  },

  togglePlay() {
    if (!this._isPlaying) {
      if (this._playQueue.length > 0 && this._isPaused) {
        this._isPaused = false;
        this._speakCurrent();
      }
      return;
    }
    if (this._isPaused) {
      this._isPaused = false;
      this._speakCurrent();
    } else {
      this._isPaused = true;
      speechSynthesis.cancel();
      this.render();
    }
  },

  _next() {
    if (this._playQueue.length === 0) return;
    // 下一本（跳过当前绘本剩余句子）
    this._playIndex++;
    this._sentIndex = 0;
    if (this._playIndex >= this._playQueue.length) {
      if (this._isLoop) this._playIndex = 0;
      else { this._isPlaying = false; this.render(); return; }
    }
    speechSynthesis.cancel();
    this._speakCurrent();
  },

  _prev() {
    if (this._playQueue.length === 0) return;
    this._playIndex--;
    this._sentIndex = 0;
    if (this._playIndex < 0) this._playIndex = this._playQueue.length - 1;
    speechSynthesis.cancel();
    this._speakCurrent();
  },

  stop() {
    speechSynthesis.cancel();
    this._isPlaying = false;
    this._isPaused = false;
    this._playQueue = [];
    this._playIndex = 0;
    this._sentIndex = 0;
    this.render();
  }
};

const babyPoetryModule = {
  // 获取本周一日期字符串
  getWeekStart(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const day = d.getDay(); // 0=周日
    const diff = day === 0 ? -6 : 1 - day; // 回到周一
    const monday = new Date(d);
    monday.setDate(d.getDate() + diff);
    return fmtDate(monday);
  },

  // 按周生成确定性的古诗索引（三首）
  getPoetryIndicesForWeek(weekStartStr) {
    const rng = new SeededRandom(weekStartStr + '-poetry');
    const indices = [];
    while (indices.length < 3) {
      const idx = Math.floor(rng.next() * POETRY_BANK.length);
      if (!indices.includes(idx)) indices.push(idx);
    }
    return indices;
  },

  async render() {
    app.setTitle('宝宝古诗');
    const today = todayStr();
    const weekStart = this.getWeekStart(today);
    const tasks = await taskManager.getTasksByModule('babypoetry');
    const currentTasks = tasks.filter(t => t.date === weekStart && t.type === 'weekly_poetry');

    if (currentTasks.length < 3) {
      // 删除已有的本周古诗重新生成
      for (const t of currentTasks) await storage.delete('tasks', t.id);
      await this.generateWeeklyTasks(weekStart);
      return this.render();
    }

    let html = '';

    // 三首古诗卡片
    currentTasks.forEach((task, i) => {
      const c = task.content;
      // 缓存当前古诗内容，供朗读按钮同步使用
      this['_currentPoetry_' + i] = c;

      html += `<div class="card poetry-card">
        <div class="poetry-header">
          <div class="poetry-icon">📖</div>
          <div>
            <div class="poetry-title">${escapeHtml(c.title)}</div>
            <div class="poetry-meta">${escapeHtml(c.dynasty)} · ${escapeHtml(c.author)}</div>
          </div>
          <div class="poetry-week">第${i+1}首</div>
        </div>
        <div class="poetry-content">`;
      c.content.split('\n').forEach(line => {
        html += `<div class="poetry-line">${escapeHtml(line)}</div>`;
      });
      html += `</div>
        <div class="poetry-explain">
          <div class="poetry-explain-title">给宝宝讲讲</div>
          <div class="poetry-explain-text">${escapeHtml(c.explain)}</div>
        </div>
        <div class="poetry-tags">${c.tags.map(t => `<span class="tag active">${escapeHtml(t)}</span>`).join('')}</div>
        <div class="poetry-actions">
          <button class="btn ${task.completed?'btn-secondary':'btn-primary'}" onclick="taskManager.toggleTaskComplete('${task.id}')">${task.completed?'已学会 ✓':'标记已学会'}</button>
          <button class="btn btn-secondary" onclick="babyPoetryModule.speakPoetryNow(${i})">朗读</button>
          <button class="btn btn-yellow" onclick="babyPoetryModule.regenerateOne('${task.id}', ${i})">换一首</button>
        </div>
      </div>`;
    });

    // 历史古诗（包括已替换的）
    const history = tasks.filter(t => t.type !== 'weekly_poetry' && t.date !== weekStart);
    if (history.length) {
      html += `<div class="meal-title">📅 已学古诗</div>`;
      html += taskManager.renderDateGroups(history, t => {
        const hc = t.content;
        return `<div class="task-item ${t.completed?'completed':''}" data-task-id="${t.id}">
          <div class="task-checkbox ${t.completed?'checked':''}" onclick="taskManager.toggleTaskComplete('${t.id}')">${t.completed?'✓':''}</div>
          <div class="task-content">
            <div class="task-title">${escapeHtml(hc.title)} <span style="color:var(--ios-text-secondary);font-weight:400;font-size:13px;">${escapeHtml(hc.dynasty)}·${escapeHtml(hc.author)}</span></div>
            <div class="task-meta">${escapeHtml(hc.content.split('\n')[0])}...</div>
          </div>
        </div>`;
      });
    }

    $('content').innerHTML = html;
  },

  async generateWeeklyTasks(weekStartStr) {
    const indices = this.getPoetryIndicesForWeek(weekStartStr);
    for (const idx of indices) {
      const poetry = POETRY_BANK[idx];
      const task = {
        id: uuid(), date: weekStartStr, module:'babypoetry', type:'weekly_poetry',
        title: poetry.title + ' · ' + poetry.author,
        content: {...poetry},
        completed: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
      };
      await storage.put('tasks', task);
    }
  },

  async regenerateOne(taskId, slotIndex) {
    const today = todayStr();
    const weekStart = this.getWeekStart(today);
    // 旧任务标记为已替换
    const old = await storage.get('tasks', taskId);
    if (old) {
      old.title += ' (已替换)';
      old.type = 'weekly_poetry_replaced';
      old.updatedAt = new Date().toISOString();
      await storage.put('tasks', old);
    }
    // 获取本周已有的古诗，避免重复
    const tasks = await taskManager.getTasksByModule('babypoetry');
    const currentTitles = tasks.filter(t => t.date === weekStart && t.type === 'weekly_poetry').map(t => t.content.title);
    // 随机选一首不重复的
    let newIdx, attempts = 0;
    do {
      newIdx = Math.floor(Math.random() * POETRY_BANK.length);
      attempts++;
    } while (currentTitles.includes(POETRY_BANK[newIdx].title) && attempts < 20);
    const poetry = POETRY_BANK[newIdx];
    await storage.put('tasks', {
      id: uuid(), date: weekStart, module:'babypoetry', type:'weekly_poetry',
      title: poetry.title + ' · ' + poetry.author,
      content: {...poetry},
      completed: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
    });
    this.render();
  },

  // 同步朗读（iOS Safari 需要在用户点击的同步上下文中调用）
  speakPoetryNow(slotIndex) {
    const poetry = slotIndex !== undefined ? this['_currentPoetry_' + slotIndex] : (this._currentPoetry_0 || this['_currentPoetry_0']);
    if (!poetry) {
      showToast('请稍候，正在加载古诗');
      return;
    }
    if (!('speechSynthesis' in window)) {
      showToast('当前设备不支持语音朗读');
      return;
    }
    const text = poetry.title + '，' + poetry.author + '。' + poetry.content.replace(/\n/g, '。');

    speechSynthesis.cancel();

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-CN';
    utter.rate = 0.65;
    utter.pitch = 1.1;

    const voices = speechSynthesis.getVoices();
    const zhVoice = voices.find(v => v.lang.startsWith('zh'));
    if (zhVoice) utter.voice = zhVoice;

    utter.onerror = () => showToast('朗读失败，请重试');
    speechSynthesis.speak(utter);
    showToast('🎵 正在朗读...');
  },

  // 预加载语音列表（iOS 需要 getVoices 提前触发）
  preloadVoices() {
    if ('speechSynthesis' in window) {
      // 触发 voices 加载
      speechSynthesis.getVoices();
      // iOS voices 异步加载，监听变化
      speechSynthesis.onvoiceschanged = () => {
        speechSynthesis.getVoices();
      };
      // 某些 iOS 版本需要"预热"：先 speak 空字符串再 cancel
      const warmup = new SpeechSynthesisUtterance('');
      speechSynthesis.speak(warmup);
      setTimeout(() => speechSynthesis.cancel(), 100);
    }
  }
};

    app.setTitle('法语学习');

          • 每天学2个词，一年掌握730个法语单词
        </div>
      </div>
    </div>`;

    $('content').innerHTML = html;
  },

  pickWordsForDay(dateStr) {
    const rng = new SeededRandom(dateStr + '-french');
    const pool = [];
    for (let i = 0; i < FRENCH_WORDS.length; i++) pool.push(i);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(rng.next() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, 2);
  },

  shuffle() {
    const pool = [];
    for (let i = 0; i < FRENCH_WORDS.length; i++) pool.push(i);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    this._wordIndices = pool.slice(0, 2);
    this.render();
  },

  // 朗读法语单词
  speak(idx) {
    if (!('speechSynthesis' in window)) {
      showToast('当前设备不支持语音');
      return;
    }
    const wordIdx = this._wordIndices[idx];
    const word = FRENCH_WORDS[wordIdx];
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word.fr);
    u.lang = 'fr-FR';
    u.rate = 0.85;
    const voices = speechSynthesis.getVoices();
    const frVoice = voices.find(v => v.lang.startsWith('fr'));
    if (frVoice) u.voice = frVoice;
    speechSynthesis.speak(u);
  },

  // 朗读法语例句
  speakSentence(idx) {
    if (!('speechSynthesis' in window)) {
      showToast('当前设备不支持语音');
      return;
    }
    const wordIdx = this._wordIndices[idx];
    const word = FRENCH_WORDS[wordIdx];
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word.sentence);
    u.lang = 'fr-FR';
    u.rate = 0.8;
    const voices = speechSynthesis.getVoices();
    const frVoice = voices.find(v => v.lang.startsWith('fr'));
    if (frVoice) u.voice = frVoice;
    speechSynthesis.speak(u);
  }
};
